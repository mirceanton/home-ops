---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/generators.external-secrets.io/password_v1alpha1.json
#? Random secret generator. Tianji's JWT/auth secrets only need to be stable, not shared
#? with anything else, so they are generated in-cluster instead of living in 1Password.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tianji
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
#? Generated once and never rotated: rotating JWT_SECRET/AUTH_SECRET logs everyone out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tianji
spec:
  refreshPolicy: CreatedOnce

  target:
    name: tianji-secret
    creationPolicy: Owner

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tianji
      rewrite:
        - regexp: { source: "^password$", target: "JWT_SECRET" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tianji
      rewrite:
        - regexp: { source: "^password$", target: "AUTH_SECRET" }
