---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner

  values:
    fullnameOverride: local-path-provisioner

    helperImage:
      repository: docker.io/library/busybox
      tag: "1.38.0"

    storageClass:
      create: true
      defaultClass: true
      name: local-path
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    #? Talos UserVolumeConfig `local-path-provisioner` (talos/clusters/public/patches/m70q.yaml)
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path-provisioner

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
      seccompProfile: { type: RuntimeDefault }
