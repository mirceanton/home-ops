---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: blog

  values:
    global: { createDefaultServiceAccount: false }

    controllers:
      blog:
        replicas: 1
        strategy: RollingUpdate

        containers:
          app:
            image:
              repository: ghcr.io/mirceanton/mirceanton.com
              tag: 2026.11.28@sha256:9e7cd9f37ae67423c3a82e156671578695f917da0f023b0978ac835984c5373b

            env:
              NGINX_ENTRYPOINT_QUIET_LOGS: "1"

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 2
                  failureThreshold: 30

            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              privileged: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 #? nginx-unprivileged image user
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: blog
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          #? mirceanton.com and www are still Terraform-managed records pointing at GitHub Pages.
          #? Keep external-dns away from it until the DNS cutover is done in cloud-terraform.
          external-dns.kubernetes.io/controller: none
        hostnames: ["mirceanton.com", "www.mirceanton.com"]
        parentRefs:
          - name: envoy-external
            namespace: network-system
            sectionName: https

    persistence:
      #? nginx-unprivileged writes its pid file and temp/cache dirs under /tmp
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
