---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-announcement-policy
spec:
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: services-pool
spec:
  blocks:
    - cidr: 172.16.30.15/32 # envoy-external
