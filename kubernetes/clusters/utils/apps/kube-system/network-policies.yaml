---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/networking.k8s.io/networkpolicy_v1.json
#? Deny all ingress and egress by default; each component opts in below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/networking.k8s.io/networkpolicy_v1.json
#? Every pod may resolve cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/networking.k8s.io/networkpolicy_v1.json
#? Answers every pod, forwards to the router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock: { cidr: 10.0.20.10/32 }
        - ipBlock: { cidr: 10.244.0.1/32 }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
  egress:
    - to:
        - ipBlock: { cidr: 10.0.20.10/32 }
      ports:
        - { port: 6443, protocol: TCP }
    - to:
        - ipBlock: { cidr: 10.0.20.1/32 }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/networking.k8s.io/networkpolicy_v1.json
#? Called by the API server, scrapes the kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.10/32 }
        - ipBlock: { cidr: 10.244.0.1/32 }
      ports:
        - { port: 10250, protocol: TCP }
  egress:
    - to:
        - ipBlock: { cidr: 10.0.20.10/32 }
      ports:
        - { port: 6443, protocol: TCP }
    - to:
        - ipBlock: { cidr: 10.0.20.10/32 }
      ports:
        - { port: 10250, protocol: TCP }
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/networking.k8s.io/networkpolicy_v1.json
#? Only watches the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 10.0.20.10/32 }
      ports:
        - { port: 6443, protocol: TCP }
