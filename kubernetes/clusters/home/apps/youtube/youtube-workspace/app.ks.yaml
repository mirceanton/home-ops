---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app youtube-workspace
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: youtube

  path: ./kubernetes/clusters/home/apps/youtube/youtube-workspace/app
  components:
    - ../../../../../../components/cnpg/
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      # Keycloak 25+ puts `sub` into access tokens through the `basic` scope, and the app refuses a
      # token without one. The component's default list leaves `basic` out.
      KEYCLOAK_CLIENT_DEFAULT_SCOPES: '["basic", "profile", "email", "roles", "web-origins", "acr", "groups"]'

  decryption: { provider: sops }
  dependsOn:
    - name: cloudnative-pg-operator
      namespace: database-system
    - name: cloudnative-pg-plugins
      namespace: database-system
    - name: external-secrets-operator
      namespace: security-system
    - name: 1password-connect
      namespace: security-system
    - name: keycloak-operator-config
      namespace: security-system
    - name: litellm-operator
      namespace: ai
