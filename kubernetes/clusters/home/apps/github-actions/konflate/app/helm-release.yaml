---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate

  values:
    config:
      repo: github://mirceanton/home-ops
      clusterPath: kubernetes/clusters/home/apps
      appClientId: "900136"
      logFormat: json
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.home.mirceanton.com

    # The chart's default memory limit is 1Gi (it drives GOMEMLIMIT = 90%); a
    # large diff render can spike past it and the kernel OOM-kills the container
    # before the GC reclaims. 2Gi gives the render pipeline headroom; keep the
    # requests small so the pod stays Burstable.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 2Gi

    secret:
      existingSecret: konflate-secret

    httpRoute:
      enabled: true
      hostnames: ["konflate.home.mirceanton.com"]
      parentRefs:
        - name: envoy-internal
          namespace: network-system

    persistence:
      enabled: true
      storageClass: openebs-zfs-cache
      size: 2Gi

    monitoring:
      serviceMonitor:
        enabled: true
