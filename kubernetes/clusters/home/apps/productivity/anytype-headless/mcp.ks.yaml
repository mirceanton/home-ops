---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app anytype-mcp
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: productivity

  path: ./kubernetes/clusters/home/apps/productivity/anytype-headless/mcp
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  dependsOn:
    - name: anytype-headless
      namespace: productivity
    - name: litellm-operator
      namespace: ai
