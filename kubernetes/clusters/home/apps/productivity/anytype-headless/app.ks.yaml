---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app anytype-headless
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: productivity

  path: ./kubernetes/clusters/home/apps/productivity/anytype-headless/app
  components:
    - ../../../../../../components/volsync/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: openebs
      namespace: storage-system
