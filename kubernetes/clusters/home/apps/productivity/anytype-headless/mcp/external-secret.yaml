---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name anytype-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAPI_MCP_HEADERS: '{"Authorization":"Bearer {{ .api_key }}","Anytype-Version":"2025-11-08"}'

  data:
    - secretKey: api_key
      remoteRef:
        key: Anytype Headless
        property: hermes_api_key
