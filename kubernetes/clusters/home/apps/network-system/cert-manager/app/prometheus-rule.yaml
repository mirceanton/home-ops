---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
spec:
  groups:
    - name: cert-manager.rules
      rules:
        # ---- Controller Availability ----
        - alert: CertManagerAbsent
          expr: absent(up{job=~".*cert-manager.*"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cert-manager metrics endpoint is absent"
            description: >-
              Prometheus cannot find any cert-manager scrape target.
              The cert-manager controller may be down or the ServiceMonitor
              misconfigured.

        # ---- Certificate Readiness ----
        # The cert-manager ServiceMonitor uses honorLabels: false, so the
        # controller pod's namespace wins the `namespace` label and the
        # certificate's own namespace is renamed to `exported_namespace`.
        # Prefer exported_namespace in annotations, falling back to namespace
        # for certificates that live in the controller's own namespace.
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} is not ready"
            description: >-
              Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} has been in a
              non-Ready state for over 10 minutes. This may indicate an ACME challenge
              failure, a misconfigured issuer, or a DNS/HTTP validation problem.

        # ---- Certificate Expiry ----
        # Only alert once the scheduled renewal (status.renewalTime, exposed as
        # certmanager_certificate_renewal_timestamp_seconds) is actually overdue.
        # A fixed threshold false-positives on certificates whose renewBefore is
        # shorter than the threshold: the barman-cloud plugin's self-signed
        # certificates are valid for 90 days with renewBefore=15d, so a 21-day
        # threshold fires for ~6 days every cycle while renewal is still on track.
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (21 * 24 * 3600) and time() > certmanager_certificate_renewal_timestamp_seconds
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} expires in less than 21 days and renewal is overdue"
            description: >-
              Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} expires in
              {{ $value | humanizeDuration }} and its scheduled renewal time has
              already passed. Investigate the Certificate and CertificateRequest
              resources for errors.

        - alert: CertificateExpiringCritical
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600) and time() > certmanager_certificate_renewal_timestamp_seconds
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} expires in less than 7 days"
            description: >-
              Certificate {{ with $labels.exported_namespace }}{{ . }}{{ else }}{{ $labels.namespace }}{{ end }}/{{ $labels.name }} expires in
              {{ $value | humanizeDuration }}. Renewal has failed and the certificate
              is approaching expiry. Immediate action required to avoid an outage.
