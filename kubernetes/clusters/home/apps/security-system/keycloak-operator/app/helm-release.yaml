---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: keycloak-operator

  values:
    crds:
      install: true
      keep: true

    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi

    performance:
      syncPeriod: "5m"
      maxConcurrentRequests: 10

    metrics:
      enabled: true
      port: 8080
      serviceMonitor:
        enabled: true
        additionalLabels: {}
        interval: 30s
        scrapeTimeout: 10s

    rbac: { create: true }
    serviceAccount: { create: true }
    leaderElection: { enabled: true }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: { type: RuntimeDefault }

    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      readOnlyRootFilesystem: true

    health:
      port: 8081
