---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-access
spec:
  interval: 10m
  prune: true
  # Mappings stay un-Ready until each app's client and `access` role exist, and apps depend
  # on keycloak-operator-config, so waiting here would only stall this Kustomization.
  wait: false
  targetNamespace: security-system

  path: ./kubernetes/clusters/home/apps/security-system/keycloak-operator/access
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute: {}

  dependsOn:
    - name: keycloak-operator-config
