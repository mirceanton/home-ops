---
# Who may use which app. Each entry grants a group the `access` client role that the
# keycloak-client component creates for every app. Roles are referenced by clientId because
# KeycloakRoleMapping can only reference groups in its own namespace; apps whose group lives
# in their own namespace (dagu, open-webui) map it there instead.
# The operator only creates the groups; add users to them in the Keycloak UI.
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/keycloakrolemapping_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakRoleMapping
metadata:
  name: users-immich
spec:
  subject:
    groupRef:
      name: users
  role:
    name: access
    clientId: immich
---
