---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: ai

  path: ./kubernetes/clusters/home/apps/ai/hermes/app
  components:
    - ../../../../../../components/volsync/
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 100Gi
      VOLSYNC_PUID: "10000"
      VOLSYNC_PGID: "10000"
      KEYCLOAK_CLIENT_ID: hermes-dashboard
      # Two browser surfaces share this one client: the admin dashboard (hermes.) and the
      # Webapp (hermes-web.). Overridden because the component's default wildcard is
      # per-host, and the Webapp signs in at https://hermes-web.<domain>/auth/callback.
      KEYCLOAK_CLIENT_REDIRECT_URLS: '["https://hermes.home.mirceanton.com/*","https://hermes-web.home.mirceanton.com/*"]'
      KEYCLOAK_CLIENT_WEB_ORIGINS: '["https://hermes.home.mirceanton.com","https://hermes-web.home.mirceanton.com"]'

  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: litellm
      namespace: ai
    - name: volsync
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
