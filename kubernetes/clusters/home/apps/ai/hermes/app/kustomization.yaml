---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./external-secret.yaml
  - ./litellm-key.yaml
  - ./helm-release.yaml
  - ./oci-repository.yaml
  - ./network-policy.yaml

# Runtime config (config.yaml, SOUL.md, profile .env, skills, MCP servers, cron jobs, etc.) is
# managed manually on the PVC — the repo intentionally carries none of it.
# Only cluster-level infrastructure (secrets, volumes, network policies) lives here.
