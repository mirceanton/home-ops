---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./external-secret.yaml
  - ./litellm-key.yaml
  - ./helm-release.yaml
  - ./oci-repository.yaml

configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=./files/config.yaml
      - SOUL.md=./files/SOUL.md
      - profiles.finance-bro.config.yaml=./files/profiles/finance-bro/config.yaml
      - profiles.finance-bro.SOUL.md=./files/profiles/finance-bro/SOUL.md
      - profiles.gitops-engineer.config.yaml=./files/profiles/gitops-engineer/config.yaml
      - profiles.gitops-engineer.SOUL.md=./files/profiles/gitops-engineer/SOUL.md
      - profiles.home-assistant-helper.config.yaml=./files/profiles/home-assistant-helper/config.yaml
      - profiles.home-assistant-helper.SOUL.md=./files/profiles/home-assistant-helper/SOUL.md
      - profiles.media-managearr.config.yaml=./files/profiles/media-managearr/config.yaml
      - profiles.media-managearr.SOUL.md=./files/profiles/media-managearr/SOUL.md
      - profiles.music-curator.config.yaml=./files/profiles/music-curator/config.yaml
      - profiles.music-curator.SOUL.md=./files/profiles/music-curator/SOUL.md
      - profiles.youtube-assistant.config.yaml=./files/profiles/youtube-assistant/config.yaml
      - profiles.youtube-assistant.SOUL.md=./files/profiles/youtube-assistant/SOUL.md
  - name: hermes-seed-script
    files:
      - seed.sh=./scripts/seed.sh
      - install-hyperframes.sh=./scripts/install-hyperframes.sh
  # Repo-owned agent skills, keyed "<profile>.<category>.<skill>.SKILL.md";
  # seed.sh copies each one into that profile's own skills directory.
  - name: hermes-skills
    files:
      - youtube-assistant.creative.hyperframes-graphics.SKILL.md=./files/skills/youtube-assistant/hyperframes-graphics/SKILL.md

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
