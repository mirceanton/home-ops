---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: Discord App - Mr. Borboto
        property: token

    # Per-profile Discord identities. A secondary profile reads its token from its own
    # profiles/<name>/.env (fail-closed scoped reader), so the seed-config init container
    # renames these prefixed keys into DISCORD_BOT_TOKEN per profile.
    - secretKey: DISCORD_BOT_TOKEN_GITOPS_ENGINEER
      remoteRef:
        key: Discord App - GitOps Engineer
        property: token

    - secretKey: DISCORD_BOT_TOKEN_YOUTUBE_ASSISTANT
      remoteRef:
        key: Discord App - YouTube Assistant
        property: token

    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: Hermes - Discord
        property: mirceanton_user_id

    - secretKey: DISCORD_HOME_CHANNEL
      remoteRef:
        key: Hermes - Discord
        property: discord_home_channel_id

    - secretKey: DISCORD_HOME_CHANNEL_GITOPS_ENGINEER
      remoteRef:
        key: Hermes - Discord
        property: discord_gitops_engineer_channel_id

    - secretKey: DISCORD_HOME_CHANNEL_YOUTUBE_ASSISTANT
      remoteRef:
        key: Hermes - Discord
        property: discord_youtube_assistant_channel_id

    - secretKey: DISCORD_FREE_RESPONSE_CHANNELS
      remoteRef:
        key: Hermes - Discord
        property: discord_alertmanager_channel_id

    - secretKey: API_SERVER_KEY
      remoteRef:
        key: Hermes - Alertmanager Webhook
        property: secret
