---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: Hermes - Alertmanager Webhook
        property: secret

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
# Discord material, consumed ONLY by the seed-config init container while rendering the
# profile .env templates — bot tokens must never reach the app container's env, where the
# default profile (which runs no Discord bot) would read them unscoped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &discord-name hermes-discord-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *discord-name
    creationPolicy: Owner

  data:
    # One Discord app per profile, keyed by profile name. A bare DISCORD_BOT_TOKEN in a
    # shared secret would land in the app container env and claim a credential that
    # belongs to a profile bot (one credential cannot be consumed twice).
    - secretKey: DISCORD_BOT_TOKEN_GITOPS_ENGINEER
      remoteRef:
        key: Discord App - Mr. Borboto
        property: token

    - secretKey: DISCORD_BOT_TOKEN_YOUTUBE_ASSISTANT
      remoteRef:
        key: Discord App - YouTube Assistant
        property: token

    - secretKey: DISCORD_APP_ID_YOUTUBE_ASSISTANT
      remoteRef:
        key: Discord App - YouTube Assistant
        property: app_id

    # Each app carries the channels it owns: where the bot answers without an @mention
    # (free-response) and where its cron/notification output is delivered (home).
    - secretKey: DISCORD_FREE_RESPONSE_CHANNEL_GITOPS_ENGINEER
      remoteRef:
        key: Discord App - Mr. Borboto
        property: free_response_channel_id

    - secretKey: DISCORD_HOME_CHANNEL_GITOPS_ENGINEER
      remoteRef:
        key: Discord App - Mr. Borboto
        property: home_channel_id

    - secretKey: DISCORD_FREE_RESPONSE_CHANNEL_YOUTUBE_ASSISTANT
      remoteRef:
        key: Discord App - YouTube Assistant
        property: free_response_channel_id

    - secretKey: DISCORD_HOME_CHANNEL_YOUTUBE_ASSISTANT
      remoteRef:
        key: Discord App - YouTube Assistant
        property: home_channel_id

    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: Hermes - Discord
        property: mirceanton_user_id
