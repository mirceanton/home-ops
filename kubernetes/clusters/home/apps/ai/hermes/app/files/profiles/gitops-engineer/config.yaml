---
_config_version: 46

providers:
  litellm:
    name: LiteLLM
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    discover_models: true

model:
  default: deepseek-v4.1-flash
  provider: litellm

mcp_servers:
  Flux:
    url: http://litellm.ai.svc.cluster.local:4000/flux/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Grafana:
    url: http://litellm.ai.svc.cluster.local:4000/grafana/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Kubesearch:
    url: http://litellm.ai.svc.cluster.local:4000/kubesearch/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  GitHub:
    url: http://litellm.ai.svc.cluster.local:4000/github/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Vikunja:
    url: http://litellm.ai.svc.cluster.local:4000/vikunja/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  TrueNAS:
    url: http://litellm.ai.svc.cluster.local:4000/truenas/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Mikrotik:
    url: http://litellm.ai.svc.cluster.local:4000/mikrotik/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}

toolsets: [kanban, hermes-cli]

# A secondary multiplex profile never sees the HelmRelease's DISCORD_* container env
# (the per-profile secret scope fails closed — gateway/platforms/_shared.py::get_scoped_secret),
# so Discord behaviour has to be declared here. Applies to this profile's bot only.
discord:
  require_mention: true
  thread_require_mention: true
  auto_thread: true
  history_backfill: true
  reactions: true
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

platform_toolsets:
  discord:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

skills:
