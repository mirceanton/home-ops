---
_config_version: 46

timezone: Europe/Bucharest

providers:
  litellm:
    name: LiteLLM
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    discover_models: true

model:
  default: qwen3.8-flash
  provider: litellm

fallback_providers:
  # The driver is qwen4-max-preview on the gitops profile; degrading to a
  # flash-tier model on a provider outage is the wrong shape, so fall back
  # to the strongest cheap-tier reasoner instead.
  - provider: litellm
    model: deepseek-v4-pro

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  disabled_toolsets:
    - a2a
    - browser
    - computer_use
    - desktop_ui
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - spotify
    - video
    - video_gen
    - x_search
    - yuanbao

streaming:
  enabled: true

delegation:
  max_iterations: 100
  # Children must not inherit the parent's route. Empty provider/model means
  # "inherit the parent", so an expensive driver (e.g. the Claude subscription
  # plugin) would spend its own budget and rate limit on mechanical fan-out.
  # Both keys are recognized by the pinned v0.23.1 (`hermes config set` raises
  # no unknown-key notice) and are what the delegate tool actually reads.
  provider: litellm
  model: qwen3.8-flash
  # NOTE: `roles` is NOT a recognized key in Hermes v0.23.1 — `hermes config
  # set delegation.roles.reviewer.model` answers "not a recognized config key",
  # and no code path reads it, so nothing below routes a child today. Per-role
  # routing (reviewer -> deepseek-v4-pro, creative -> glm-5.3) needs the
  # advanced-delegation plugin's `model_map` backend; tracked as a follow-up.
  roles:
    reviewer:
      provider: litellm
      model: deepseek-v4-pro
      max_concurrent_children: 2

security: { redact_secrets: true }
privacy: { redact_pii: true }

toolsets: [kanban, hermes-cli]

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

  discord:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

auxiliary:
  compression:
    provider: litellm
    model: qwen3.8-flash
  curator:
    provider: litellm
    model: qwen3.7-plus
    reasoning_effort: high
  kanban_decomposer:
    provider: litellm
    model: qwen3.8-max
    reasoning_effort: high
  profile_describer:
    provider: litellm
    model: qwen3.8-flash
  skills_hub:
    provider: litellm
    model: deepseek-v4.1-flash
  mcp:
    provider: litellm
    model: qwen3.7-plus
  title_generation:
    provider: litellm
    model: qwen3.8-flash

gateway:
  # Profile gateways run as their own supervised services, one process
  # per profile. In-process multiplexing would route turns through
  # per-profile secret scopes whose fail-closed lookups cannot see the
  # container env credentials injected by the HelmRelease.
  multiplex_profiles: true

dashboard:
  # Cilium's node pod subnet; UI ingress is restricted to Envoy by NetworkPolicy.
  trusted_proxies: ["10.244.0.0/24"]

# The gateway serves the workspace; the admin dashboard remains on port 9119.
webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: "https://hermes.home.mirceanton.com"

mcp_servers: {}

browser: { cloud_provider: local }
computer_use: { backend: cua }

telemetry:
  shared_metrics:
    enabled: false
