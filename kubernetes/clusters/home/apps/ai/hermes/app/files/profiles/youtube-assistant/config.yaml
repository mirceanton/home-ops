---
_config_version: 46

providers:
  litellm:
    name: LiteLLM
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    discover_models: true

model:
  default: qwen3.8-max
  provider: litellm

# This profile owns the "YouTube Assistant" Discord app;
discord:
  require_mention: true
  thread_require_mention: true
  auto_thread: true
  free_response_auto_thread: true
  reactions: true
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

mcp_servers:
  Youtube Public:
    url: http://litellm.ai.svc.cluster.local:4000/youtube_public/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  YouTube Analytics:
    url: http://litellm.ai.svc.cluster.local:4000/youtube_analytics/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Vikunja:
    url: http://litellm.ai.svc.cluster.local:4000/vikunja/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  AnyType:
    url: http://litellm.ai.svc.local:4000/anytype/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}

  # Headless NLE for the autonomous video pipeline. Stdio transport: the
  # server is a filmcraft-cli subprocess with full access to the NFS media
  # mounts (/Volumes/*) this pod already has. Starts projectless; open or
  # create projects via file.open / file.newProject + file.saveAs. One
  # editing session per server instance (single-writer per project).
  # timeout is high because command_run can carry exports/renders.
  filmcraft:
    command: /opt/data/.local/bin/filmcraft-cli
    args: [mcp]
    timeout: 600
    connect_timeout: 120

toolsets: [kanban, hermes-cli]

skills:
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - arxiv
    - baoyu-infographic
    - blocked-page-recovery
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - competitor-news-monitor
    - computer-use
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - findmy
    - gif-search
    - github
    - google-workspace
    - grounded-citations
    - himalaya
    - imessage
    - inspecting-hermes-desktop-dom
    - llm-wiki
    - manim-video
    - maps
