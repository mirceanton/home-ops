---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: channel-analytics-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: youtube_analytics
  transport: http

  authType: bearer_token
  authTokenRef:
    name: channel-analytics-mcp-secret
    key: MCP_API_KEY

  workload:
    image: ghcr.io/oliverhruby/youtube-mcp:v0.1.0
    port: 8000
    path: /mcp

    env:
      - name: MCP_TRANSPORT
        value: streamable-http
      - name: MCP_HOST
        value: 0.0.0.0
      - name: MCP_PORT
        value: "8000"
      - name: YOUTUBE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: channel-analytics-mcp-secret
            key: YOUTUBE_CLIENT_ID
      - name: YOUTUBE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: channel-analytics-mcp-secret
            key: YOUTUBE_CLIENT_SECRET
      - name: YOUTUBE_REFRESH_TOKEN
        valueFrom:
          secretKeyRef:
            name: channel-analytics-mcp-secret
            key: YOUTUBE_REFRESH_TOKEN
      - name: MCP_API_KEY
        valueFrom:
          secretKeyRef:
            name: channel-analytics-mcp-secret
            key: MCP_API_KEY

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name channel-analytics-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_id
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_secret
    - secretKey: YOUTUBE_REFRESH_TOKEN
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: refresh_token
    - secretKey: MCP_API_KEY
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: mcp_bearer_token
