---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: searxng-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: searxng
  transport: http

  workload:
    image: isokoliuk/mcp-searxng:2.6.0
    port: 8080
    path: /mcp

    env:
      - name: SEARXNG_URL
        value: http://searxng.default.svc.cluster.local:8080
      # Setting a port switches the server from STDIO to Streamable HTTP.
      - name: MCP_HTTP_HOST
        value: 0.0.0.0
      - name: MCP_HTTP_PORT
        value: "8080"
      # Every request arrives from the LiteLLM pod, so the per-IP cap on new sessions
      # (20/min by default) would be shared by every client behind the gateway.
      - name: MCP_RATE_INIT_MAX
        value: "300"

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
