---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: truenas-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: truenas
  transport: http

  authType: bearer_token
  authTokenRef:
    name: truenas-mcp-secret
    key: TRUENAS_API_KEY

  workload:
    image: ghcr.io/cedricziel/truenas-mcp:0.6.0@sha256:32e2c3c029fe724411b27705a005b2de3d5184de1aff92f965912194c629fde8
    port: 8080
    path: /mcp

    env:
      - name: TRUENAS_MCP_TARGET
        value: nas.mgmt.h.mirceanton.com:443
      - name: TRUENAS_MCP_ALLOW_PLAINTEXT
        value: "true"
      - name: TRUENAS_MCP_ENABLE_WRITES
        value: "false"

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name truenas-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: TRUENAS_API_KEY
      remoteRef:
        key: "TrueNAS MCP"
        property: password
