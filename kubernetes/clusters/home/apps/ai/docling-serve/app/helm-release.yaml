---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app docling-serve
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: docling-serve

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # the image's default (UBI) user
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      docling-serve:
        containers:
          app:
            # Layout, table and OCR model weights are baked into the image.
            image:
              repository: ghcr.io/docling-project/docling-serve-cpu
              tag: v1.38.0

            env:
              DOCLING_SERVE_ENABLE_UI: "true"
              # Open WebUI uses the synchronous convert endpoint; CPU OCR on long scans needs
              # more than the default 120s.
              DOCLING_SERVE_MAX_SYNC_WAIT: "600"
              DOCLING_SERVE_SCRATCH_PATH: /tmp/docling
              XDG_CACHE_HOME: /tmp/.cache
              HF_HOME: /tmp/.cache/huggingface
              MPLCONFIGDIR: /tmp/.cache/matplotlib

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 5001
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6 # conversions are CPU-bound and can starve the probe
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        controller: docling-serve
        ports:
          http:
            port: *port

    # The UI has no auth; LAN only.
    route:
      home:
        hostnames: ["docling.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
