---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: open-webui
spec:
  proxyRef: litellm
  alias: open-webui
  mcpServers: ["searxng"]
  models:
    - "qwen3.8-flash"
    - "qwen3.8-max"
    - "qwen3.8-27b"
    - "deepseek-v4-pro"
    - "gpt-6-luna"
    - "gpt-5.6-terra"
    - "gpt-6-sol"

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: open-webui
spec:
  proxyRef: litellm
  secretName: open-webui-litellm-key
  keyAlias: open-webui
  teamID: open-webui
  metadata:
    app: open-webui
    description: API key for Open WebUI model and MCP access
