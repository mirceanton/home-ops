---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name telegraf-mqtt-auth
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: "Mosquitto - z2m"
        property: username
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: "Mosquitto - z2m"
        property: password
