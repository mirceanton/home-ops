---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: home-assistant

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Seeds the git-managed config fragments (files/gitops/*) and a
          # rendered secrets.yaml into the /config PVC before HA starts. The
          # PVC's configuration.yaml stays UI-managed; the script only appends
          # the "auth_oidc: !include gitops/auth_oidc.yaml" line if missing.
          seed-config:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0
            env:
              # OIDC client credentials from the Keycloak-operator-managed
              # secret (components/keycloak-client), rendered into
              # /config/gitops/secrets.yaml for HA's !secret mechanism.
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-secret
                    key: client-secret
            command: ["/bin/sh", "/scripts/seed.sh"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
            envFrom: []
            env:
              TZ: Europe/Bucharest
              HASS_HTTP_TRUSTED_PROXY_1: 10.244.0.0/16 # Pod network CIDR
              HASS_HTTP_USE_X_FORWARDED_FOR: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123

    route:
      home:
        hostnames:
          - homeassistant.home.mirceanton.com
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      seed-config:
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            seed-config:
              - path: /seed
                readOnly: true

      seed-script:
        type: configMap
        name: home-assistant-seed-script
        advancedMounts:
          home-assistant:
            seed-config:
              - path: /scripts
                readOnly: true
