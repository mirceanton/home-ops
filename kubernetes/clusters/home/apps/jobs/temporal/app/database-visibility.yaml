---
# The shared cnpg component only creates the "${APP}" database; Temporal also
# needs a separate visibility store.
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
spec:
  name: temporal_visibility
  owner: temporal
  cluster:
    name: temporal-postgres
