---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal
spec:
  hostnames: ["temporal.home.mirceanton.com"]
  parentRefs:
    - name: envoy-internal
      namespace: network-system
  rules:
    - backendRefs:
        # Service rendered by the temporalio/temporal chart as
        # "<release>-web" on the web.service.port (8080).
        - name: temporal-web
          namespace: jobs
          port: 8080
