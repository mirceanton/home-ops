---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  interval: 30m
  chart:
    spec:
      chart: temporal
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: temporal

  values:
    server:
      replicaCount: 1

      config:
        persistence:
          defaultStore: default
          visibilityStore: visibility
          #! Cannot be changed after the initial deployment.
          numHistoryShards: 512
          datastores:
            default:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal
                connectAddr: "temporal-postgres-rw.jobs.svc.cluster.local:5432"
                connectProtocol: tcp
                user: temporal
                # CNPG-managed credentials (secret created by the cnpg component)
                existingSecret: temporal-postgres-app
                secretKey: password
                # Databases are created by the CNPG Database CRs, not the chart.
                createDatabase: false
                manageSchema: true
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal_visibility
                connectAddr: "temporal-postgres-rw.jobs.svc.cluster.local:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-postgres-app
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h

        # Create the Temporal application namespace (distinct from the k8s one)
        # so workers/clients have something to connect to out of the box.
        namespaces:
          create: true
          useHelmHooks: true
          namespace:
            - name: default
              retention: 3d

      frontend:
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
      history:
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 1Gi
      matching:
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
      worker:
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi

    admintools:
      enabled: true

    web:
      enabled: true
      # Native OIDC against Keycloak (replaces the gateway-level SecurityPolicy).
      # Client credentials come from the keycloak-client component's secret.
      additionalEnv:
        - name: TEMPORAL_AUTH_ENABLED
          value: "true"
        - name: TEMPORAL_AUTH_PROVIDER_URL
          value: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
        - name: TEMPORAL_AUTH_CLIENT_ID
          valueFrom:
            secretKeyRef: { name: temporal-oidc-secret, key: client-id }
        - name: TEMPORAL_AUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: temporal-oidc-secret, key: client-secret }
        - name: TEMPORAL_AUTH_CALLBACK_URL
          value: https://temporal.home.mirceanton.com/auth/sso/callback
        - name: TEMPORAL_AUTH_SCOPES
          value: openid,email,profile
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    schema:
      # Flux runs real Helm, so pre-install/pre-upgrade hooks are honoured and
      # guarantee the schema jobs finish before the server pods start.
      useHelmHooks: true
