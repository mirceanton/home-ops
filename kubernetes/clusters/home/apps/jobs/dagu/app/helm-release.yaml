---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagu
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dagu

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      #? k8s.run steps authenticate to the API server with this pod's token
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      dagu:
        annotations:
          reloader.stakater.com/auto: "true"

        #! Dagu does not hot-reload DAGs, skips symlinked files by default (which is
        #! exactly what a ConfigMap mount is made of) and needs to write into its
        #! DAGs dir. Copy the real files into a writable dir instead, one subfolder
        #! per section; reloader restarts the pod when a ConfigMap changes.
        initContainers:
          dags:
            image: &image
              repository: ghcr.io/dagucloud/dagu
              tag: 2.18.2
            command:
              - sh
              - -c
              - cd /dag-config && find . -maxdepth 2 -name '*.yaml' -not -path '*/..*' -exec cp -L --parents -t /dags {} +
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image: *image
            # The image entrypoint needs root (usermod/sudo) and a writable rootfs,
            # so bypass it and run the server directly as the image's UID 1000.
            command: [dagu]
            args: [start-all]
            env:
              DAGU_HOME: /var/lib/dagu
              DAGU_DAGS_DIR: /dags
              # DAGs sit in one subfolder per section (see kustomization.yaml)
              DAGU_DAG_DISCOVERY_RECURSIVE: "true"
              DAGU_HOST: 0.0.0.0
              DAGU_PORT: "8080"
              DAGU_TZ: Etc/UTC
              # Auth is handled by Keycloak at the gateway (oidc.yaml, which also
              # restricts access to the "dagu" group). The default in recent
              # versions is "builtin", so this must be explicit.
              DAGU_AUTH_MODE: none

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

            securityContext: *securityContext

    service:
      app:
        controller: dagu
        ports:
          http:
            port: 8080

    route:
      home:
        hostnames: ["jobs.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts: [{ path: /var/lib/dagu }]
      home:
        type: emptyDir
        globalMounts: [{ path: /home/dagu }]
      tmp:
        type: emptyDir
        globalMounts: [{ path: /tmp }]
      dags:
        type: emptyDir
        globalMounts: [{ path: /dags }]

      # One entry per section, mounted for the init container only
      dags-crd-schemas:
        type: configMap
        name: dagu-dags-crd-schemas
        advancedMounts:
          dagu:
            dags: [{ path: /dag-config/crd-schemas, readOnly: true }]
      dags-etcd-defrag:
        type: configMap
        name: dagu-dags-etcd-defrag
        advancedMounts:
          dagu:
            dags: [{ path: /dag-config/etcd-defrag, readOnly: true }]

    serviceAccount: { dagu: {} }
    rbac:
      roles:
        dagu:
          type: Role
          rules:
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [create, get, list, watch, delete]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [pods/log]
              verbs: [get]
      bindings:
        dagu:
          type: RoleBinding
          roleRef:
            identifier: dagu
          subjects:
            - identifier: dagu
