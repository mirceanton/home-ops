---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagu
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dagu

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      # k8s.run steps authenticate to the API server with this pod's token
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      dagu:
        annotations:
          reloader.stakater.com/auto: "true"

        # Dagu does not hot-reload DAGs and skips symlinked files by default, which
        # is exactly what a ConfigMap mount is made of. Copy the real files into a
        # writable dir instead; reloader restarts the pod when the ConfigMap changes.
        initContainers:
          dags:
            image: &image
              repository: ghcr.io/dagucloud/dagu
              tag: 2.18.2
            command: [sh, -c, "cp -L /dag-config/*.yaml /dags/"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image: *image
            # The image entrypoint needs root (usermod/sudo) and a writable rootfs,
            # so bypass it and run the server directly as the image's UID 1000.
            command: [dagu]
            args: [start-all]
            env:
              DAGU_HOME: /var/lib/dagu
              DAGU_DAGS_DIR: /dags
              DAGU_HOST: 0.0.0.0
              DAGU_PORT: "8080"
              DAGU_TZ: Etc/UTC
              # Auth is handled by Keycloak at the gateway (oidc.yaml, which also
              # restricts access to the "dagu" group). The default in recent
              # versions is "builtin", so this must be explicit.
              DAGU_AUTH_MODE: none

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

            securityContext: *securityContext

    service:
      app:
        controller: dagu
        ports:
          http:
            port: 8080

    route:
      home:
        hostnames: ["dagu.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /var/lib/dagu
      dags:
        type: emptyDir
        globalMounts:
          - path: /dags
      dag-config:
        type: configMap
        name: dagu-dags
        advancedMounts:
          dagu:
            dags:
              - path: /dag-config
                readOnly: true
      home:
        type: emptyDir
        advancedMounts:
          dagu:
            app:
              - path: /home/dagu
      tmp:
        type: emptyDir
        advancedMounts:
          dagu:
            app:
              - path: /tmp

    # The pod's own identity: may only create/watch Jobs in this namespace.
    # What each Job's pod is allowed to do is decided by the SA the DAG picks
    # (see runners/).
    serviceAccount: { dagu: {} }
