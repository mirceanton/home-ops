---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./etcd-defrag.runner.yaml
  - ./crd-schema-publisher.runner.yaml

configMapGenerator:
  - name: dagu-dags-home-ops
    files:
      - ./dags/etcd-defrag.yaml
      - ./dags/crd-schema-publisher.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # DAGs use ${VAR} syntax of their own; don't let Flux substitute it.
    kustomize.toolkit.fluxcd.io/substitute: disabled
