---
# What the Dagu pod itself may do: launch k8s.run steps as Jobs in this
# namespace and stream their logs. It cannot touch anything else.
# NOTE: "create jobs" + "use any SA in this namespace" means anyone who can
# trigger a DAG can run a pod as the SAs defined in runners/. Access to the UI
# is therefore limited to the "dagu" Keycloak group (see oidc.yaml).
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dagu-job-runner
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dagu-job-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dagu-job-runner
subjects:
  # The ServiceAccount is created by the HelmRelease, so the namespace is not
  # rewritten by Flux's targetNamespace and has to be explicit.
  - kind: ServiceAccount
    name: dagu
    namespace: jobs
