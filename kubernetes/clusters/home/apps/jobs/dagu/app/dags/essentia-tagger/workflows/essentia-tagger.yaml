---
description: |
  Analyze the Lidarr-managed music library with Essentia ML models for
  genre and mood tagging. Processes only files not yet recorded in the
  PVC-backed tracking file. Check the "Force" box in the UI to clear
  the tracking file and re-process every file.

  ## How it works

  1. Scans /music (NFS-backed PVC) for supported audio files
  2. Compares against /var/lib/essentia/processed.txt (PVC)
  3. Symlinks unprocessed files into a temp directory
  4. Runs essentia-tagger in directory mode on those files only
  5. Marks successfully processed files in the tracking file

  ## Write mode

  By default this runs in dry-run mode. To enable actual tag writing:
  1. Remove `--dry-run` from the command args in the Dagu UI
  2. Set the music volume mount to `read_only: false`
  3. Add `--overwrite` to replace existing tags (optional)

  ## Performance

  CPU-only, ~5-15 sec/track, 2-3 GB RAM. Daily cron typically
  processes just a handful of new Lidarr additions.

group: Home-Ops
schedule: "0 3 * * *" #? daily at 3am
catchup_window: 1m

params:
  - name: force
    type: boolean
    default: false
    description: Clear tracking file and re-process every file

steps:
  - name: tag-music
    action: k8s.run
    with:
      #? Pin to a specific sha tag after the image is published.
      #? https://github.com/mirceanton/home-ops/issues/632
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/wrapper.sh --dry-run --genres 3 --genre-threshold 15 --genre-format parent_child --mood-threshold 0.5 --log-dir /var/log/essentia --workers 1
      namespace: jobs

      env:
        - name: ESSENTIA_FORCE
          value: "${params.force}"

      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "4"
          memory: 4Gi

      volumes:
        - name: music
          persistent_volume_claim:
            claim_name: nfs-music
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-wrapper
        - name: logs
          empty_dir: {}

      volume_mounts:
        - name: music
          mount_path: /music
          read_only: true
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true
        - name: logs
          mount_path: /var/log/essentia

      pod_security_context:
        run_as_non_root: true
        #? UID 568 matches the Lidarr container so the pod can write to NFS
        #? when read_only is disabled and --dry-run is removed.
        run_as_user: 568
        run_as_group: 568
        fs_group: 568
        seccomp_profile: { type: RuntimeDefault }
      security_context:
        allow_privilege_escalation: false
        read_only_root_filesystem: true
        capabilities: { drop: [ALL] }
