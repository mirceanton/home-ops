---
description: |
  Analyze the Lidarr-managed music library with Essentia ML models for
  genre and mood tagging. Processes only files not yet recorded in the
  PVC-backed tracking file. Check the "Force" box in the UI to clear
  the tracking file and re-process every file.

  ## How it works

  1. Scans /music (NFS-backed PVC) for supported audio files
  2. Compares against /var/lib/essentia/processed.txt (PVC)
  3. Symlinks unprocessed files into a temp directory
  4. Runs essentia-tagger in directory mode on those files only
  5. Marks successfully processed files in the tracking file

  ## Write mode

  The `mode` parameter selects between dry-run (analyze only, the default)
  and apply (write genre/mood tags to the audio files). The music volume is
  mounted read-write so apply mode can write tags; the pod runs as UID 568
  (same as Lidarr) so ownership matches on NFS.

  ## Performance

  CPU-only, ~4 sec/track with 4 workers, ~6 GB RAM. Daily cron
  typically processes just a handful of new Lidarr additions.

group: Home-Ops
schedule: "0 3 * * *" #? daily at 3am
catchup_window: 1m

params:
  - name: mode
    type: string
    default: "--dry-run"
    description: Tagging mode — dry-run (analyze only) or apply (write tags)
    enum:
      - "--dry-run"
      - "--apply"
  - name: force
    type: boolean
    default: false
    description: Clear tracking file and re-process every file

steps:
  - name: tag-music
    action: k8s.run
    with:
      #? Pin to a specific sha tag after the image is published.
      #? https://github.com/mirceanton/home-ops/issues/632
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/wrapper.sh --genres 3 --genre-threshold 15 --genre-format parent_child --mood-threshold 0.5 --log-dir /var/log/essentia --workers 4
      namespace: jobs

      env:
        - name: ESSENTIA_FORCE
          value: "${params.force}"
        - name: ESSENTIA_MODE
          value: "${params.mode}"

      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "8"
          memory: 8Gi

      volumes:
        - name: music
          persistent_volume_claim:
            claim_name: nfs-music
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-wrapper
        - name: logs
          empty_dir: {}
        - name: tmp
          empty_dir: {}

      volume_mounts:
        - name: music
          mount_path: /music
          #? Read-write so --apply mode can write tags; dry-run mode never
          #? writes. UID 568 (see pod_security_context) owns the NFS files.
          read_only: false
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true
        - name: logs
          mount_path: /var/log/essentia
        - name: tmp
          mount_path: /tmp

      pod_security_context:
        run_as_non_root: true
        #? UID 568 matches the Lidarr container so the pod can write tags
        #? to the NFS-backed music library in apply mode.
        run_as_user: 568
        run_as_group: 568
        fs_group: 568
        seccomp_profile: { type: RuntimeDefault }
      security_context:
        allow_privilege_escalation: false
        read_only_root_filesystem: true
        capabilities: { drop: [ALL] }
