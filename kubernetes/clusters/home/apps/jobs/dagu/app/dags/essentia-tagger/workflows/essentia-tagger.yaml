---
description: Runs Essentia ML Models to tag the Music Library with mood and genre tags.

group: Music
schedule: "0 3 * * *" #? daily at 3am
catchup_window: 1m
overlap_policy: skip #? The staging list is shared on one PVC across runs

params:
  - name: dry_run
    type: boolean
    default: false
    description: Analyze only — uncheck to write tags to the audio files
  - name: force
    type: boolean
    default: false
    description: Clear tracking file and re-process every file on a live run

steps:
  - name: prepare
    action: k8s.run
    with:
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/prepare.sh
      namespace: jobs

      env:
        - name: ESSENTIA_FORCE
          value: "${params.force}"
        - name: ESSENTIA_DRY_RUN
          value: "${params.dry_run}"

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi

      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts

      volume_mounts:
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true

      pod_security_context: &podSecurityContext
        run_as_non_root: true
        run_as_user: 568
        run_as_group: 568
        fs_group: 568
        seccomp_profile: { type: RuntimeDefault }
      security_context: &securityContext
        allow_privilege_escalation: false
        read_only_root_filesystem: true
        capabilities: { drop: [ALL] }

  - name: scan
    action: k8s.run
    depends: prepare
    with:
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/scan.sh
      namespace: jobs

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 512Mi

      volumes:
        - name: music
          persistent_volume_claim:
            claim_name: nfs-music
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts

      volume_mounts:
        - name: music
          mount_path: /music
          read_only: true
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true

      pod_security_context: *podSecurityContext
      security_context: *securityContext

  - name: tag-music
    action: k8s.run
    depends: scan
    with:
      #? Pin to a specific sha tag after the image is published.
      #? https://github.com/mirceanton/home-ops/issues/632
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/tag.sh --genres 3 --genre-threshold 15 --genre-format parent_child --mood-threshold 0.5 --log-dir /var/log/essentia --workers 4
      namespace: jobs

      env:
        - name: ESSENTIA_DRY_RUN
          value: "${params.dry_run}"

      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "8"
          memory: 8Gi

      volumes:
        - name: music
          persistent_volume_claim:
            claim_name: nfs-music
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts
        - name: logs
          empty_dir: {}
        - name: tmp
          empty_dir: {}

      volume_mounts:
        - name: music
          mount_path: /music
          #? Read-write so live mode (dry_run unchecked) can write tags;
          #? dry-run never writes. UID 568 owns the NFS files.
          read_only: false
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true
        - name: logs
          mount_path: /var/log/essentia
        - name: tmp
          mount_path: /tmp

      pod_security_context: *podSecurityContext
      security_context: *securityContext

  - name: record
    action: k8s.run
    depends: tag-music
    with:
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/record.sh
      namespace: jobs

      env:
        - name: ESSENTIA_DRY_RUN
          value: "${params.dry_run}"

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi

      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts

      volume_mounts:
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true

      pod_security_context: *podSecurityContext
      security_context: *securityContext

  - name: cleanup
    action: k8s.run
    depends: record
    with:
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/cleanup.sh
      namespace: jobs

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi

      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts

      volume_mounts:
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true

      pod_security_context: *podSecurityContext
      security_context: *securityContext

#? Always clean up after the main steps, including failures and aborts.
handler_on:
  exit:
    name: cleanup-on-exit
    action: k8s.run
    with:
      image: ghcr.io/mirceanton/essentia-tagger:latest
      command: /bin/bash /scripts/cleanup.sh
      namespace: jobs

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi

      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: essentia-tagger
        - name: scripts
          config_map:
            name: essentia-tagger-scripts

      volume_mounts:
        - name: state
          mount_path: /var/lib/essentia
        - name: scripts
          mount_path: /scripts
          read_only: true

      pod_security_context: *podSecurityContext
      security_context: *securityContext