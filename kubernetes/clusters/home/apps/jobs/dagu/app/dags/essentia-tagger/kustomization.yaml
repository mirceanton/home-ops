---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./pvc.yaml

configMapGenerator:
  - name: dagu-dags-essentia-tagger
    files:
      - ./workflows/essentia-tagger.yaml
  - name: essentia-tagger-wrapper
    files:
      - ./wrapper.sh

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
