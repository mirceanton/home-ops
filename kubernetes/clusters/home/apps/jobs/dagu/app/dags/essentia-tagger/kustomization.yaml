---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./nfs-music.yaml
  - ./pvc.yaml

configMapGenerator:
  - name: dagu-dags-essentia-tagger
    files:
      - ./workflows/essentia-tagger.yaml
  - name: essentia-tagger-scripts
    files:
      - ./scripts/prepare.sh
      - ./scripts/scan.sh
      - ./scripts/tag.sh
      - ./scripts/record.sh
      - ./scripts/cleanup.sh

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
