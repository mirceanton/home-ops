---
description: Audits the music library with beets and produces metadata quality reports
group: Home-Ops
# No schedule by default — run manually or add a schedule when the audit is stable.
# schedule: "30 3 * * 0"  # weekly on Sunday at 3:30am

params:
  - name: mode
    type: string
    default: "--dry-run"
    description: Audit mode — dry-run (report only) or apply (write tags)
    enum:
      - "--dry-run"
      - "--apply"

steps:
  - name: audit
    action: k8s.run
    with:
      image: ghcr.io/mirceanton/beets:latest
      command: python /app/audit.py /music --db /data/beets.db --config /data/config.yaml --output /data/reports ${params.mode}
      namespace: jobs

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      volumes:
        # Beets database, config, and reports — persists across runs
        - name: data
          persistent_volume_claim:
            claim_name: beets-data
        # Music library — read-only for dry-run.
        # Change to read_only: false when switching mode to --apply.
        - name: music
          nfs:
            server: nas.stor.h.mirceanton.com
            path: /mnt/tank/Media
      volume_mounts:
        - name: data
          mount_path: /data
        - name: music
          mount_path: /music
          read_only: true

      pod_security_context:
        run_as_non_root: true
        run_as_user: 1000
        run_as_group: 1000
        fs_group: 1000
        seccomp_profile: { type: RuntimeDefault }
      security_context:
        allow_privilege_escalation: false
        read_only_root_filesystem: true
        capabilities: { drop: [ALL] }
