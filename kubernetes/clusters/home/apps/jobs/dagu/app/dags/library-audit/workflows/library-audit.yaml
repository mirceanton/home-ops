---
description: Audits the music library with beets and produces metadata quality reports
group: Home-Ops

params:
  - name: mode
    type: string
    default: "--dry-run"
    description: Audit mode — dry-run (report only) or apply (write tags)
    enum:
      - "--dry-run"
      - "--apply"

steps:
  - name: audit
    action: k8s.run
    with:
      image: ghcr.io/mirceanton/beets:sha-e4647e41bf0e03fb974aedb733341251c850212b
      command: sh -c 'mkdir -p /data/reports /reports-pvc/reports; cp /reports-pvc/beets.db /data/beets.db 2>/dev/null || true; python /app/audit.py /music --db /data/beets.db --config /data/config.yaml --output /data/reports ${params.mode}; cp /data/beets.db /reports-pvc/beets.db; cp -r /data/reports/* /reports-pvc/reports/'
      namespace: jobs
      env:
        - name: HOME
          value: /data

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      volumes:
        - name: data
          empty_dir: {}
        - name: music
          persistent_volume_claim:
            claim_name: nfs-music
        - name: reports
          persistent_volume_claim:
            claim_name: beets-data

      volume_mounts:
        - name: data
          mount_path: /data
        - name: music
          mount_path: /music
          read_only: true
        - name: reports
          mount_path: /reports-pvc

      pod_security_context:
        run_as_non_root: true
        run_as_user: 1000
        run_as_group: 1000
        fs_group: 1000
        seccomp_profile: { type: RuntimeDefault }
      security_context:
        allow_privilege_escalation: false
        read_only_root_filesystem: true
        capabilities: { drop: [ALL] }
