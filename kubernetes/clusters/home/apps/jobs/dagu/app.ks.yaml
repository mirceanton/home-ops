---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dagu
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: jobs

  path: ./kubernetes/clusters/home/apps/jobs/dagu/app
  components:
    - ../../../../../../components/volsync/
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  decryption: { provider: sops }
  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: litellm-operator
      namespace: ai
    - name: volsync
      namespace: storage-system
    - name: openebs
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
