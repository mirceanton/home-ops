---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zfs-exporter
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: zfs-exporter

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      zfs-exporter:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          zfs-exporter:
            image:
              repository: ghcr.io/pdf/zfs_exporter
              tag: v2.5.1@sha256:95289975bd8983ed70f2281720d6af30c7f6e2c2283df03d36b8e7e0bfab0c9d
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

            #? The upstream image runs the host's own zpool/zfs binaries chrooted into /host
            #? (--host-root=/host is the image default), so the CLI always matches the host's
            #? ZFS kernel module. On Talos these come from the siderolabs/zfs system extension
            #? and live under /usr/local/{bin,sbin}, which the default --host-root.path covers.
            #? Privileged access is still required: Kubernetes has no --device equivalent, so
            #? /dev/zfs (visible through the host-root mount) is refused by the device cgroup
            #? otherwise. Inside the chroot each command still runs as nobody.
            securityContext:
              privileged: true

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0

    service:
      zfs-exporter:
        ports:
          http:
            port: 9134

    serviceMonitor:
      zfs-exporter:
        serviceName: zfs-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s

    persistence:
      #? Upstream image requirement: host root mounted read-only at /host as a slave of the
      #? host's mounts (HostToContainer), so datasets the host unmounts also disappear from
      #? the container (a private mount would keep them mounted and block host-side destroys).
      #? /dev/zfs is reached through this mount inside the chroot; privileged mode grants the
      #? device cgroup access. No separate /dev/zfs hostPath is needed.
      host-root:
        type: hostPath
        hostPath: /
        hostPathType: Directory
        globalMounts:
          - path: /host
            readOnly: true
            mountPropagation: HostToContainer
