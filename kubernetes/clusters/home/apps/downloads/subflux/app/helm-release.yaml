---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subflux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: subflux

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      subflux:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Deep-merge the git-owned settings over the UI-managed config.yaml
          # (git wins on the keys it declares; everything else is kept).
          render-config:
            image:
              repository: docker.io/mikefarah/yq
              tag: "4"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                if [ -s /config/config.yaml ]; then
                  yq eval-all '(select(fileIndex == 0) * select(fileIndex == 1)) | ... comments = ""' \
                    /config/config.yaml /config-template/config.yaml > /config/config.yaml.tmp
                else
                  cp /config-template/config.yaml /config/config.yaml.tmp
                fi
                chmod 600 /config/config.yaml.tmp
                mv /config/config.yaml.tmp /config/config.yaml
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image:
              repository: ghcr.io/cplieger/subflux
              tag: v0.8.0
            env:
              TZ: "Europe/Bucharest"
            envFrom:
              - secretRef:
                  name: subflux-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8374
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        endpoints:
          - port: http

    route:
      home:
        hostnames: ["subflux.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      config-template:
        type: configMap
        name: subflux-config-template
        defaultMode: 0444
        advancedMounts:
          subflux:
            render-config:
              - path: /config-template/config.yaml
                subPath: config.yaml
      # Must match the paths Sonarr and Radarr see (media_roots in files/config.yaml).
      media:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/
        globalMounts:
          - path: /data/media
      # Admin bootstrap socket, health marker and preview scratch files.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
