---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: subflux-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: subflux-secret
    creationPolicy: Owner

  data:
    - secretKey: SUBFLUX_SONARR_API_KEY
      remoteRef:
        key: Sonarr API Key
        property: password
    - secretKey: SUBFLUX_RADARR_API_KEY
      remoteRef:
        key: Radarr API Key
        property: password
