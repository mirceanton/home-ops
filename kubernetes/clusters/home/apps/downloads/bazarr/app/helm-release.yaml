---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bazarr

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false

    controllers:
      bazarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.2

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 6767
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      app:
        ports:
          http:
            port: *port
    route:
      home:
        hostnames: ["bazarr.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      # Media tree parent: writable emptyDir (fsGroup) so apps can still
      # create entries at /data/media itself. Movies/TV_Shows moved to the
      # rusty HDD pool; the other datasets stay on tank, same container paths.
      media:
        type: emptyDir
        globalMounts:
          - path: /data/media
      media-movies:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/rusty/Media/Movies
        globalMounts:
          - path: /data/media/Movies
      media-tvshows:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/rusty/Media/TV_Shows
        globalMounts:
          - path: /data/media/TV_Shows
      media-music:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Music
        globalMounts:
          - path: /data/media/Music
      media-books:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Books
        globalMounts:
          - path: /data/media/Books
      media-documents:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Documents
        globalMounts:
          - path: /data/media/Documents
      media-photos:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Photos
        globalMounts:
          - path: /data/media/Photos
      media-3d-models:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/3D_Models
        globalMounts:
          - path: /data/media/3D_Models
      downloads:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/scratch/Torrent_Downloads
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
