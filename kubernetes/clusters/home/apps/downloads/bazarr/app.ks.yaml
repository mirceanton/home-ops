---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: downloads

  path: ./kubernetes/clusters/home/apps/downloads/bazarr/app
  components:
    - ../../../../../../components/volsync/
    - ../../../../../../components/nfs-scaler/
    - ../../../../../../components/oidc/
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  # home-ops#1425 migration window: pause nfs-scaler and scale to 0 so the
  # tank->rusty final delta sees quiescent writers (replicas: 0 alone would
  # not hold — KEDA scales back to 1 while the NAS probe is up). Remove to unpause.
  patches:
    - target:
        kind: ScaledObject
        group: keda.sh
      patch: |-
        - op: add
          path: /metadata/annotations
          value:
            autoscaling.keda.sh/paused-replicas: "0"

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi #!TODO 256Mi?
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"

  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: keda
      namespace: kube-system
    - name: keycloak-operator-config
      namespace: security-system
