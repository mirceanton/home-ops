---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: sonarr

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false

    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2997
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: api_key
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__ALLOWEDHOSTS: sonarr.home.mirceanton.com,sonarr,sonarr.downloads.svc.cluster.local
              SONARR__SERVER__PORT: &port 8989
              SONARR__UPDATE__BRANCH: develop
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      app:
        ports:
          http:
            port: *port
    route:
      home:
        hostnames: ["sonarr.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      # Media tree parent: writable emptyDir (fsGroup) so apps can still
      # create entries at /data/media itself. Movies/TV_Shows moved to the
      # rusty HDD pool; the other datasets stay on tank, same container paths.
      media:
        type: emptyDir
        globalMounts:
          - path: /data/media
      media-movies:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/rusty/Media/Movies
        globalMounts:
          - path: /data/media/Movies
      media-tvshows:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/rusty/Media/TV_Shows
        globalMounts:
          - path: /data/media/TV_Shows
      media-music:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Music
        globalMounts:
          - path: /data/media/Music
      media-books:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Books
        globalMounts:
          - path: /data/media/Books
      media-documents:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Documents
        globalMounts:
          - path: /data/media/Documents
      media-photos:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Photos
        globalMounts:
          - path: /data/media/Photos
      media-3d-models:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/3D_Models
        globalMounts:
          - path: /data/media/3D_Models
      downloads:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/scratch/Torrent_Downloads
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
