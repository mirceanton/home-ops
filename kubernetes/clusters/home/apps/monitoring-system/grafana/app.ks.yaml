---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: monitoring-system

  path: ./kubernetes/clusters/home/apps/monitoring-system/grafana/app
  components:
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      KEYCLOAK_CLIENT_REDIRECT_URLS: '["https://grafana.admin.mirceanton.com/*"]'
      KEYCLOAK_CLIENT_WEB_ORIGINS: '["https://grafana.admin.mirceanton.com"]'
      KEYCLOAK_CLIENT_HOME_URL: "https://grafana.admin.mirceanton.com"
      DASHBOARD_TITLE: "Grafana"
      DASHBOARD_SUBTITLE: "Monitoring"
      DASHBOARD_ICON: "grafana"
      DASHBOARD_CATEGORY: "Monitoring"

  dependsOn:
    #? wait for the 1password-connect secret store to be ready
    - name: 1password-connect
      namespace: security-system
    - name: grafana-operator
    - name: openebs
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
