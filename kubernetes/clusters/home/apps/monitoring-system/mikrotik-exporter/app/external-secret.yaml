---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp-credentials
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: mktxp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        rb5009.yaml: |
          username: {{ .rb5009_username }}
          password: {{ .rb5009_password }}
        hex.yaml: |
          username: {{ .hex_username }}
          password: {{ .hex_password }}
        capxl.yaml: |
          username: {{ .capxl_username }}
          password: {{ .capxl_password }}

  data:
    - secretKey: rb5009_username
      remoteRef:
        key: RB5009 - metrics
        property: username
    - secretKey: rb5009_password
      remoteRef:
        key: RB5009 - metrics
        property: password
    - secretKey: hex_username
      remoteRef:
        key: HEX - metrics
        property: username
    - secretKey: hex_password
      remoteRef:
        key: HEX - metrics
        property: password
    - secretKey: capxl_username
      remoteRef:
        key: CAPXL - metrics
        property: username
    - secretKey: capxl_password
      remoteRef:
        key: CAPXL - metrics
        property: password
