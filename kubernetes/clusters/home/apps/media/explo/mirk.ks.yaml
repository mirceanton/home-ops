---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app explo-mirk
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: media

  path: ./kubernetes/clusters/home/apps/media/explo/mirk
  components:
    - ../../../../../../components/volsync/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"

  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: external-secrets-operator
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: navidrome
      namespace: media
    - name: lidarr
      namespace: downloads
