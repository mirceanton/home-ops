---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name explo-mirk-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: UI_USERNAME
      remoteRef:
        key: Navidrome
        property: username
    - secretKey: UI_PASSWORD
      remoteRef:
        key: Navidrome
        property: password
    - secretKey: SYSTEM_USERNAME
      remoteRef:
        key: Navidrome
        property: username
    - secretKey: SYSTEM_PASSWORD
      remoteRef:
        key: Navidrome
        property: password
    - secretKey: LISTENBRAINZ_USER_TOKEN
      remoteRef:
        key: ListenBrainz Token - mirk
        property: password
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: Lidarr API Key
        property: password
