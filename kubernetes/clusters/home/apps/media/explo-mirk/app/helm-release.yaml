---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: explo-mirk
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: explo-mirk

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      explo-mirk:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lumepart/explo
              tag: v1.2.0
            envFrom:
              - secretRef:
                  name: explo-mirk-secret
            env:
              TZ: Europe/Bucharest
              WEB_UI: "true"
              WEB_ADDR: ":7288"
              WEB_DATA_PATH: /opt/explo/config
              WEB_ENV_PATH: /opt/explo/config/.env
              PUID: "568"
              PGID: "568"
              EXPLO_SYSTEM: subsonic
              SYSTEM_URL: http://navidrome.media.svc.cluster.local:4533
              LISTENBRAINZ_USER: mirk
              DOWNLOAD_SERVICES: lidarr
              LIDARR_URL: http://lidarr.downloads.svc.cluster.local:8686
              # The default root-folder name is Music; verify it in Lidarr before the first run.
              LIDARR_ROOT_FOLDER: Music
              LIDARR_MIGRATE_DOWNLOADS: "false"
              DOWNLOAD_DIR: /data
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ui/setup-status
                    port: &port 7288
                  periodSeconds: 20
                  timeoutSeconds: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ui/setup-status
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            # Upstream's start.sh updates yt-dlp via pip and manages root's crontab.
            # It drops the web process to PUID/PGID, but needs a writable root FS.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    route:
      home:
        hostnames: ["explo-mirk.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /opt/explo/config
      music:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Music
        globalMounts:
          - path: /data
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
