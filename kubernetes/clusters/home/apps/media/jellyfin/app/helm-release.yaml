---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: jellyfin

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        # Jellyfin only honours X-Forwarded-For when the sending address is listed
        # under Dashboard -> Networking -> Known proxies, which is stored in
        # /config/config/network.xml on the volsync-backed PVC. Without it every
        # request appears to come from the Envoy pod and the activity log cannot
        # show the real client, so register the pod network before Jellyfin starts.
        initContainers:
          known-proxies:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -ec
              - |
                proxy=10.244.0.0/24
                file=/config/config/network.xml

                # First start: Jellyfin has not written its configuration yet.
                if [ ! -f "${file}" ]; then
                  echo "network.xml not present yet, nothing to do"
                  exit 0
                fi
                grep -qF "<string>${proxy}</string>" "${file}" && exit 0

                if grep -qF '<KnownProxies />' "${file}"; then
                  sed -i "s|<KnownProxies />|<KnownProxies><string>${proxy}</string></KnownProxies>|" "${file}"
                elif grep -qF '</KnownProxies>' "${file}"; then
                  sed -i "s|</KnownProxies>|<string>${proxy}</string></KnownProxies>|" "${file}"
                else
                  sed -i "s|</NetworkConfiguration>|<KnownProxies><string>${proxy}</string></KnownProxies></NetworkConfiguration>|" "${file}"
                fi

                grep -qF "<string>${proxy}</string>" "${file}"
                echo "registered known proxy ${proxy} in ${file}"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          main:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11
            env:
              TZ: "Europe/Bucharest"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_FFmpeg__probesize: 50000000
              JELLYFIN_FFmpeg__analyzeduration: 50000000
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
                nvidia.com/gpu: 1
              limits:
                memory: 4Gi
                nvidia.com/gpu: 1

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness: *probe
              startup: *probe

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        ports:
          http:
            port: *port

    route:
      home:
        hostnames: ["jellyfin.home.mirceanton.com", "movies.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      tvshows:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/TV_Shows
        globalMounts:
          - path: /nfs-media/TV_Shows
            readOnly: true
      movies:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Movies
        globalMounts:
          - path: /nfs-media/Movies
            readOnly: true
      transcode:
        type: emptyDir
        globalMounts:
          - path: /transcode
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
