---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-postgres
spec:
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
      - "timescaledb"

    parameters:
      timescaledb.telemetry_level: "off"
      max_locks_per_transaction: "128"

    extensions:
      - name: pgvector
        image:
          # renovate: datasource=docker
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie
      - name: postgis
        ld_library_path: [system]
        image:
          # renovate: datasource=docker
          reference: ghcr.io/cloudnative-pg/postgis-extension-testing:3.6.4-18-trixie@sha256:2401cbae15a15c0273cb437521c7e05ef8534fa30c17413bd886db7c531ae908
      - name: vchord
        image:
          # renovate: datasource=docker
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v0.5.3@sha256:c310ede47f7f82bd257c3e53806d60680d5899c318ca946fb313efad9a90a78e
        dynamic_library_path: ["/usr/lib/postgresql/18/lib"]
        extension_control_path: ["/usr/share/postgresql/18/"]
      - name: timescaledb
        image:
          # renovate: datasource=docker
          reference: ghcr.io/shusaan/timescaledb-testing:2.23.1-18-trixie@sha256:e06e12e4dc1df9d427b22a7cbab19ef9b800552d712a439e948fcc4efacf67d4

  managed:
    roles:
      - name: immich
        ensure: present
        login: true

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ${APP}
spec:
  extensions:
    - name: vector
    - name: vchord
    - name: cube
    - name: earthdistance
    - name: postgis
    - name: timescaledb
