---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app modelhub
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: maker

  path: ./kubernetes/clusters/home/apps/maker/modelhub/app
  components:
    - ../../../../../../components/volsync/
    - ../../../../../../components/nfs-scaler/
    - ../../../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"
      DASHBOARD_TITLE: "ModelHub"
      DASHBOARD_SUBTITLE: "3D Model Library"
      DASHBOARD_ICON: "/assets/modelhub.svg"
      DASHBOARD_CATEGORY: "Maker"

  decryption: { provider: sops }
  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: keda
      namespace: kube-system
    - name: keycloak-operator-config
      namespace: security-system
