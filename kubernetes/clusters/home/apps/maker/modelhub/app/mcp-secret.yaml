---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name modelhub-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    # Model-hub personal access token (UI: Profile -> API Tokens) that LiteLLM
    # forwards as the Authorization bearer header when calling modelhub's
    # native MCP endpoint (/api/mcp). Admin role = full CRUD incl. delete/purge;
    # editor covers everything except destructive tools.
    - secretKey: MODELHUB_API_TOKEN
      remoteRef:
        key: "ModelHub MCP"
        property: token
