---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app solidcraft
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: solidcraft

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      solidcraft:
        containers:
          app:
            image:
              repository: ghcr.io/mirceanton/solidcraft-web
              tag: sha-9da82b72e7a437b86c7f236824644beb0fd6a6eb

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: solidcraft
        ports:
          http:
            port: 8080

    route:
      cad:
        hostnames: ["cad.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
