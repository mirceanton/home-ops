---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./oci-repository.yaml
  - ./helm-release.yaml
  - ./keycloak-role-mapping.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: home-dashboard-config
    files:
      - config.yaml=files/config.yaml
      - modelhub.svg=files/modelhub.svg
