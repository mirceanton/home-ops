---
# Presentation config for https://github.com/mirceanton/home-dashboard. Apps with a Keycloak
# client are discovered automatically (see DASHBOARD_* in each app.ks.yaml); this file only
# orders categories and adds links for things without a client.
title: Home
theme:
  mode: auto
  palette: default
assetsDir: /config/assets
