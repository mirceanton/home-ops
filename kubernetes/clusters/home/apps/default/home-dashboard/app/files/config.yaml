  - { name: Home }
  - { name: Maker }
  - { name: Downloads }
  - { name: Tools }
  - { name: AI }
  - { name: Personal }
  - { name: Bomkii }
  - { name: Monitoring }
  - { name: GitOps }
  - { name: Networking }
  - { name: Home Automation }
  - { name: Servers }
  - { name: Core Services }
  - { name: Hardware }
