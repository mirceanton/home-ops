---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-dashboard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: home-dashboard

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      home-dashboard:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mirceanton/home-dashboard
              tag: v0.1.0

            env:
              DASHBOARD_ISSUER_URL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
              DASHBOARD_REDIRECT_URL: https://dashboard.home.mirceanton.com/oauth2/callback
              DASHBOARD_CONFIG: /config/config.yaml
              DASHBOARD_CLIENT_ID:
                valueFrom:
                  secretKeyRef: { name: home-dashboard-oidc-secret, key: client-id }
              DASHBOARD_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef: { name: home-dashboard-oidc-secret, key: client-secret }
              # Cookies are signed and encrypted with keys derived from this; reusing the
              # operator-generated client secret avoids a separate 1Password item.
              DASHBOARD_SESSION_KEY:
                valueFrom:
                  secretKeyRef: { name: home-dashboard-oidc-secret, key: client-secret }

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: &port 8080 }
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /readyz, port: *port }
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: home-dashboard
        ports:
          http:
            port: *port

    persistence:
      config:
        type: configMap
        name: home-dashboard-config
        advancedMounts:
          home-dashboard:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
              - path: /config/assets/modelhub.svg
                subPath: modelhub.svg
                readOnly: true

    route:
      home:
        hostnames: ["dashboard.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system
