---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/keycloakclient_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: "${APP}"
spec:
  clusterRealmRef:
    name: homelab

  clientId: ${KEYCLOAK_CLIENT_ID:-"${APP}"} #? defaults to metadata.name

  # Auto-create Secret with client credentials
  clientSecretRef:
    create: true
    name: "${APP}-oidc-secret"
    clientIdKey: client-id
    clientSecretKey: client-secret

  definition:
    description: ${KEYCLOAK_CLIENT_DESCRIPTION:-"Operator Managed"}
    baseUrl: ${KEYCLOAK_CLIENT_HOME_URL:-"https://${APP}.home.mirceanton.com"}
    protocol: ${KEYCLOAK_CLIENT_PROTOCOL:-openid-connect}
    publicClient: ${KEYCLOAK_CLIENT_PUBLIC:-false}
    standardFlowEnabled: ${KEYCLOAK_CLIENT_STANDARD_FLOW:-true}
    directAccessGrantsEnabled: ${KEYCLOAK_CLIENT_DIRECT_ACCESS_GRANTS:-true}
    serviceAccountsEnabled: ${KEYCLOAK_CLIENT_SERVICE_ACCOUNTS:-true}
    redirectUris: ${KEYCLOAK_CLIENT_REDIRECT_URLS:-["https://${APP}.home.mirceanton.com/*"]}
    webOrigins: ${KEYCLOAK_CLIENT_WEB_ORIGINS:-["https://${APP}.home.mirceanton.com"]}
    defaultClientScopes: ${KEYCLOAK_CLIENT_DEFAULT_SCOPES:-["profile", "email", "roles", "web-origins", "acr", "groups"]}

    # Card metadata for the home dashboard (ghcr.io/mirceanton/home-dashboard). Empty means
    # "fall back": title -> clientId, icon -> clientId from homarr-labs/dashboard-icons,
    # url -> baseUrl, category -> "Apps". Keep the unquoted ${VAR:-""} form: Flux re-serializes
    # before substituting, so quoting the whole value would turn an empty default into null.
    # Only plain-text values belong here (attributes must stay strings); ordering and hiding
    # live in the dashboard's own config file.
    attributes:
      dashboard.title: ${DASHBOARD_TITLE:-""}
      dashboard.subtitle: ${DASHBOARD_SUBTITLE:-""}
      dashboard.icon: ${DASHBOARD_ICON:-""}
      dashboard.category: ${DASHBOARD_CATEGORY:-""}
      dashboard.url: ${DASHBOARD_URL:-""}
