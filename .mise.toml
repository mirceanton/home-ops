[env]
SOPS_AGE_KEY_FILE = '{{config_root}}/age.key'

[tools]
# Runtimes
node = "latest"
uv = "latest"

# Kubectl + Tools + Plugins
"aqua:kubectl" = "1.37.1"
"github:mirceanton/kubectl-switch" = "latest"
"github:josegonzalez/kubectl-eso" = "latest"
"github:cloudnative-pg/cloudnative-pg" = "latest"
"aqua:kustomize" = "latest"
"aqua:derailed/k9s" = "latest"

# Flux Tools
"aqua:fluxcd/flux2" = "2.9.6"
"github:home-operations/flate" = "latest"

# Helm + Plugins
"aqua:helm" = "latest"
helmfile = "latest"

# Talos Stuff
"aqua:talosctl" = "1.14.2"
"aqua:talhelper" = "3.1.17"
"github:mirceanton/talswitcher" = "latest"
# Used by talos/zimaboard/ (talstomize config). Only pre-releases exist so far,
# so this is pinned to an exact tag - releases/latest does not resolve.
# NOTE: talos/zimaboard/ needs the `contractVersion` support merged in
# mirceanton/talstomize#22, so this pin must be bumped to the next release
# (the tag workflow runs daily) before that directory can be rendered.
"github:mirceanton/talstomize" = "v0.1.0-rc.2"

# Misc Tools
task = "latest"
sops = "latest"
age = "latest"
direnv = "latest"
yq = "latest"

# Linters
actionlint = "latest"
shellcheck = "latest"
"npm:prettier" = "latest"
