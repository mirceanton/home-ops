[env]
SOPS_AGE_KEY_FILE = '{{config_root}}/age.key'

[tools]
# Runtimes
node = "latest"
uv = "latest"

# Kubectl + Tools + Plugins
"aqua:kubectl" = "1.37.2"
"github:mirceanton/kubectl-switch" = "latest"
"github:josegonzalez/kubectl-eso" = "latest"
"github:cloudnative-pg/cloudnative-pg" = "latest"
"aqua:kustomize" = "latest"
sofka = "latest"

# Flux Tools
"aqua:fluxcd/flux2" = "2.10.0"
"github:home-operations/flate" = "latest"

# Helm + Plugins
"aqua:helm" = "latest"
helmfile = "latest"

# Talos Stuff
"aqua:talosctl" = "1.14.5"
"github:mirceanton/talstomize" = "v1.0.2"
"github:mirceanton/talswitcher" = "latest"

# Misc Tools
task = "latest"
sops = "latest"
age = "latest"
direnv = "latest"
yq = "latest"

# Linters
actionlint = "latest"
shellcheck = "latest"
"npm:prettier" = "latest"

[settings]
# Hold back freshly published tool releases (supply-chain protection).
minimum_release_age = "3d"
