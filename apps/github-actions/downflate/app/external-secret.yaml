---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: downflate-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: downflate-secret
    creationPolicy: Owner

  data:
    - secretKey: DOWNFLATE_GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: Renovate Operator - GitHub App PEM
        property: key
    - secretKey: DOWNFLATE_WEBHOOK_SECRET
      remoteRef:
        key: Downflate - Webhook Secret
        property: password
