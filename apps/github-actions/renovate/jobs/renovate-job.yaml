---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: mirceanton
spec:
  schedule: 15/30 * * * * # every 30 minutes
  image: ghcr.io/renovatebot/renovate:44.56.3
  parallelism: 5

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  discoveryFilters: ["mirceanton/*"]
  provider: { name: github }

  extraEnv:
    - name: RENOVATE_REDIS_URL
      value: "redis://renovate-dragonfly:6379"
    - name: RENOVATE_CACHE_DIR
      value: /tmp/renovate-cache
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |-
        ["pnpm run bundle", "mise install", "mise lock", "helm-docs --chart-search-root=. --log-level=warn", "helm-schema --chart-search-root . --skip-auto-generation required,additionalProperties --append-newline"]
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: |-
        ["mise"]
    # helm-docs/helm-schema live in their own OCI image volumes (see below)
    # outside the base image's default PATH dirs, since neither ships a
    # conveniently-empty directory to mount into like mise does. Appended
    # (not prepended) so nothing on the existing PATH gets shadowed.
    - name: PATH
      value: "/home/ubuntu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/tools/helm-docs:/opt/tools/helm-schema"
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_TOKEN
    - name: RENOVATE_HOST_RULES
      value: >-
        [
          {
            "hostType": "docker",
            "matchHost": "docker.io",
            "username": "$(DOCKERHUB_USERNAME)",
            "password": "$(DOCKERHUB_TOKEN)"
          }
        ]

  extraVolumes:
    - name: renovate-cache
      persistentVolumeClaim:
        claimName: renovate-cache
    - name: mise-bin
      image:
        # renovate: depName=ghcr.io/jdx/mise datasource=docker
        reference: ghcr.io/jdx/mise:2026.8.3
        pullPolicy: IfNotPresent
    - name: helm-docs-bin
      image:
        # renovate: depName=jnorwood/helm-docs datasource=docker
        reference: docker.io/jnorwood/helm-docs:v1.14.2
        pullPolicy: IfNotPresent
    - name: helm-schema-bin
      image:
        # renovate: depName=ghcr.io/dadav/helm-schema datasource=docker
        reference: ghcr.io/dadav/helm-schema:v0.23.4
        pullPolicy: IfNotPresent

  extraVolumeMounts:
    - name: renovate-cache
      mountPath: /tmp/renovate-cache
    - name: mise-bin
      # /home/ubuntu/bin is the first entry on PATH and is empty in the base
      # image, so mounting mise's bin dir there makes `mise` resolvable
      # without touching PATH or shadowing anything else on it.
      mountPath: /home/ubuntu/bin
      subPath: usr/local/bin
      readOnly: true
    - name: helm-docs-bin
      mountPath: /opt/tools/helm-docs
      subPath: usr/bin
      readOnly: true
    - name: helm-schema-bin
      # helm-schema's binary lives at the image root, so mount the whole
      # thing (no subPath) rather than trying to isolate a single file.
      mountPath: /opt/tools/helm-schema
      readOnly: true

  secretRef: mr-borboto-auth-token
  webhook:
    enabled: true
    authentication:
      enabled: false
