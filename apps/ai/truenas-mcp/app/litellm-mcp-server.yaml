---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: truenas-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: truenas
  transport: http

  authType: bearer_token
  authTokenRef:
    name: truenas-mcp-secret
    key: TRUENAS_API_KEY

  workload:
    image: ghcr.io/cedricziel/truenas-mcp:0.4.2@sha256:1a165c9b3831b8cf546c78231857896431c27a4465d2fcb16260c7d578bbee55
    port: 8080
    path: /mcp

    env:
      - name: TRUENAS_MCP_TARGET
        value: nas.mgmt.h.mirceanton.com:443
      - name: TRUENAS_MCP_ALLOW_PLAINTEXT
        value: "true"
      # Read-only: the mutating tool tier stays unregistered.
      - name: TRUENAS_MCP_ENABLE_WRITES
        value: "false"

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
