---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: truenas-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: truenas
  transport: http

  authType: bearer_token
  authTokenRef:
    name: truenas-mcp-secret
    key: TRUENAS_API_KEY

  # The official truenas/truenas-mcp is a stdio-only binary with no published
  # image, so it cannot be run from spec.workload (the operator always dials an
  # HTTP URL). This is the HTTP-native TrueNAS SCALE MCP server instead:
  # streamable HTTP on :8080/mcp, no credential of its own, one caller-supplied
  # API key per request.
  workload:
    image: ghcr.io/cedricziel/truenas-mcp:0.4.2@sha256:1a165c9b3831b8cf546c78231857896431c27a4465d2fcb16260c7d578bbee55
    port: 8080
    path: /mcp

    env:
      # TrueNAS SCALE 25.04+ (the server dials wss://<target>/api/current).
      # nas.mgmt.h.mirceanton.com is the NAS itself, not an SSO-fronted host,
      # and its Let's Encrypt certificate verifies, so neither
      # TRUENAS_MCP_TARGET_INSECURE nor TRUENAS_MCP_TARGET_ALLOW_PLAINTEXT is set.
      - name: TRUENAS_MCP_TARGET
        value: nas.mgmt.h.mirceanton.com:443
      # The MCP listener is plain HTTP: litellm is the only client and talks to
      # the ClusterIP over the in-cluster network.
      - name: TRUENAS_MCP_ALLOW_PLAINTEXT
        value: "true"
      # Read-only: the mutating tool tier stays unregistered.
      - name: TRUENAS_MCP_ENABLE_WRITES
        value: "false"

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
