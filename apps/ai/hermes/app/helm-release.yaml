---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: hermes

  values:
    controllers:
      hermes:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            args: ["sleep", "infinity"]

            envFrom:
              - secretRef: { name: hermes-secret }
            env:
              TZ: Europe/Bucharest
              HERMES_HOME: /opt/data
              HOME: /opt/data

              TERMINAL_ENV: "local"

              HERMES_IGNORE_USER_CONFIG: "1"
              HERMES_SKIP_CONFIG_MIGRATION: "1"
              HERMES_INFERENCE_MODEL: qwen3.8-flash
              HERMES_MAX_ITERATIONS: "90"
              HERMES_AGENT_TIMEOUT: "1800"
              HERMES_REDACT_SECRETS: "true"

              # S6 CONFIG
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"

              # EXTRA TOOLS
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080

              # LITELLM settings
              OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm-key
                    key: key

              # DASHBOARD settings
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &port 9119
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.home.mirceanton.com"
              HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab"
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: hermes-oidc-secret
                    key: client-id
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-oidc-secret
                    key: client-secret

              # Discord credentials, allowlist and channel IDs come from envFrom.
              DISCORD_REQUIRE_MENTION: "true"
              DISCORD_AUTO_THREAD: "true"
              DISCORD_REACTIONS: "true"
              DISCORD_ALLOW_MENTION_EVERYONE: "false"
              DISCORD_ALLOW_MENTION_ROLES: "false"
              DISCORD_ALLOW_MENTION_USERS: "true"
              DISCORD_ALLOW_MENTION_REPLIED_USER: "true"

              # OpenAI-compatible API consumed by Hermano and webhook clients.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: "8642"

            resources:
              requests:
                cpu: 150m
                memory: 1Gi
              limits:
                memory: 8Gi
            ports:
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
              - containerPort: &api_port 8642
                name: api
                protocol: TCP

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      dashboard:
        controller: hermes
        ports:
          http:
            port: *dashboard_port

      api:
        controller: hermes
        ports:
          http:
            port: *api_port

    route:
      dashboard:
        hostnames: ["hermes.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http

    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      run:
        type: emptyDir
        globalMounts:
          - path: /run

      media-music:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Music
        globalMounts:
          - path: /Volumes/Media/Music
      media-movies:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Movies
        globalMounts:
          - path: /Volumes/Media/Movies
      media-tvshows:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/TV_Shows
        globalMounts:
          - path: /Volumes/Media/TV_Shows
      media-books:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/Books
        globalMounts:
          - path: /Volumes/Media/Books

      projects-mirceanton:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Projects/mirceanton
        globalMounts:
          - path: /Volumes/Projects/mirceanton
