---
_config_version: 46

providers:
  litellm:
    name: LiteLLM
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    discover_models: true

model:
  default: qwen3.8-max
  provider: litellm

mcp_servers:
  Youtube Public:
    url: http://litellm.ai.svc.cluster.local:4000/youtube_public/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  YouTube Analytics:
    url: http://litellm.ai.svc.cluster.local:4000/youtube_analytics/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  YouTube Workspace:
    url: http://litellm.ai.svc.cluster.local:4000/youtube_workspace/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}
  Vikunja:
    url: http://litellm.ai.svc.cluster.local:4000/vikunja/mcp/
    headers:
      Authorization: Bearer ${LITELLM_API_KEY}

toolsets: [kanban, hermes-cli]

skills:
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - arxiv
    - baoyu-infographic
    - blocked-page-recovery
    - box
    - claude-code
