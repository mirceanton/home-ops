model:
  default: qwen3.8-flash
  provider: litellm

providers:
  litellm:
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    api_key: "${LITELLM_API_KEY}"

gateway:
  api_server:
    enabled: true
    # Defaults to 127.0.0.1 - binds loopback-only and is unreachable from
    # hermano (a separate pod) without this.
    host: "0.0.0.0"
    port: 8642
    key: "{{ .API_SERVER_KEY }}"

mcp_servers:
  github:
    url: "http://litellm.ai.svc.cluster.local:4000/github/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  firefly:
    url: "http://litellm.ai.svc.cluster.local:4000/firefly/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  affine:
    url: "http://litellm.ai.svc.cluster.local:4000/affine/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  kubesearch:
    url: "http://litellm.ai.svc.cluster.local:4000/kubesearch/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  flux:
    url: "http://litellm.ai.svc.cluster.local:4000/flux/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  grafana:
    url: "http://litellm.ai.svc.cluster.local:4000/grafana/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  home_assistant:
    url: "http://litellm.ai.svc.cluster.local:4000/home_assistant/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  navidrome:
    url: "http://litellm.ai.svc.cluster.local:4000/navidrome/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

  streamarr:
    url: "http://litellm.ai.svc.cluster.local:4000/streamarr/mcp"
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"

toolsets:
  - hermes-cli

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3

streaming:
  enabled: false

security:
  redact_secrets: true

privacy:
  redact_pii: true

platform_toolsets:
  signal:
    - hermes-cli
  cli:
    - hermes-cli

discord:
  require_mention: true
  thread_require_mention: false
  auto_thread: true
  reactions: true
  ignored_channels: []
  no_thread_channels: []
  history_backfill: false
  history_backfill_limit: 50
  channel_prompts: {}
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

group_sessions_per_user: false

dashboard:
  # Envoy Gateway's forwarded headers through envoy-internal aren't
  # guaranteed to yield the right scheme for redirect_uri reconstruction,
  # so declare it explicitly rather than rely on X-Forwarded-Proto guessing.
  public_url: https://hermes.home.mirceanton.com
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
      client_id: hermes-dashboard
      scopes: "openid profile email"
