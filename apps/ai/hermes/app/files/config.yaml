model:
  default: hermes

providers:
  litellm:
    base_url: http://litellm:4000/v1
    api_key: "{{ .LITELLM_API_KEY }}"

mcp_servers:
  github:
    # github-mcp's own nginx sidecar injects the Authorization header with
    # a live-refreshed GitHub App installation token, so this config never
    # changes on token rotation and Hermes never restarts because of it.
    url: "http://github-mcp.ai.svc.cluster.local:8080/mcp"

  firefly:
    url: "http://firefly-mcp.finance.svc.cluster.local:3000"
    headers:
      Authorization: "Bearer {{ .FIREFLY_MCP_TOKEN }}"

  affine:
    url: "http://affine-mcp.productivity.svc.cluster.local:3000/mcp"
    headers:
      Authorization: "Bearer {{ .AFFINE_MCP_TOKEN }}"

  kubesearch:
    url: "http://kubesearch-mcp.ai.svc.cluster.local:3000/mcp"

  flux:
    url: "http://flux-mcp.flux-system.svc.cluster.local:9090/mcp"

  grafana:
    url: "http://grafana-mcp.monitoring-system.svc.cluster.local:8000/sse"
    transport: sse

  home_assistant:
    url: "http://home-assistant-mcp.home-automation.svc.cluster.local:8086/mcp"

  navidrome:
    url: "http://navidrome-mcp.media.svc.cluster.local:3000/mcp"

  streamarr:
    url: "http://streamarr.downloads.svc.cluster.local:8080/mcp"

  stockii:
    url: "http://stockii.bomkii.svc.cluster.local:8080/mcp/sse"
    transport: sse

  image_gen:
    command: "npx"
    args: ["-y", "mcp-openai-image-generator", "--models", "wan2.7", "wan2.7-pro"]
    env:
      OPENAI_API_KEY: "{{ .LITELLM_API_KEY }}"
      OPENAI_BASE_URL: "http://litellm:4000/v1"

toolsets:
  - hermes-cli

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3

streaming:
  enabled: false

security:
  redact_secrets: true

privacy:
  redact_pii: true

platform_toolsets:
  signal:
    - hermes-cli
  cli:
    - hermes-cli

discord:
  require_mention: true
  thread_require_mention: false
  auto_thread: true
  reactions: true
  ignored_channels: []
  no_thread_channels: []
  history_backfill: false
  history_backfill_limit: 50
  channel_prompts: {}
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

group_sessions_per_user: false

dashboard:
  # Envoy Gateway's forwarded headers through envoy-internal aren't
  # guaranteed to yield the right scheme for redirect_uri reconstruction,
  # so declare it explicitly rather than rely on X-Forwarded-Proto guessing.
  public_url: https://hermes.home.mirceanton.com
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
      client_id: hermes-dashboard
      scopes: "openid profile email"
