---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-keys
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: ai

  path: ./apps/ai/litellm-keys/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: litellm-operator
      namespace: ai
    - name: litellm
      namespace: ai
