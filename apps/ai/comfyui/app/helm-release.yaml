---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfyui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: comfyui

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      comfyui:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # yanwk/comfyui-boot: just ComfyUI + ComfyUI-Manager, listens on
              # whatever CLI_ARGS says. cu130 is the officially recommended
              # CUDA version for Ada Lovelace (RTX 4070) - see
              # https://github.com/YanWenKun/ComfyUI-Docker#cuda-compatibility
              # Switched from ghcr.io/ai-dock/comfyui, whose bundled Caddy +
              # cloud-rental service portal (designed for RunPod/Vast.ai proxy
              # tunnels) redirected browser requests to "localhost" instead of
              # serving the app behind our own ingress hostname.
              repository: yanwk/comfyui-boot
              tag: cu130-slim-v2@sha256:32efcc9d6d5ea9d6b73794cd658c9c09524ba932f7aa105580003c9b69d30bbc

            env:
              # ComfyUI defaults to listening on 127.0.0.1 - has to be told
              # explicitly to listen on all interfaces to be reachable at all
              # from the Service/route.
              CLI_ARGS: "--listen 0.0.0.0 --port 8188"

              # Used by a ComfyUI custom node (install via ComfyUI-Manager) that
              # calls DashScope directly - going straight to Alibaba rather than
              # through litellm, whose OpenAI-compatible routing doesn't cover
              # DashScope's async video-generation task API. Same host your
              # QwenCloud token-plan subscription uses for litellm's qwen/wan/
              # happyhorse models (apps/ai/litellm/app/files/config.yaml), minus
              # the /compatible-mode/v1 suffix that's specific to litellm's
              # OpenAI-style chat/embedding calls.
              # TODO: confirm the exact path/task-polling shape the DashScope
              # node you install expects (native video-synthesis API is
              # async: submit task -> poll -> fetch result URL).
              DASHSCOPE_BASE_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com
              DASHSCOPE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: comfyui-secret
                    key: QWEN_KEY

            resources:
              requests:
                cpu: 500m
                memory: 4Gi
                nvidia.com/gpu: "1"
              limits:
                memory: 24Gi
                nvidia.com/gpu: "1"

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8188 }
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 10
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8188 }
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 40

            securityContext:
              allowPrivilegeEscalation: false

    defaultPodOptions:
      enableServiceLinks: false
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30

    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188

    route:
      main:
        hostnames: ["comfyui.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      # Not backed up - model weights & installed nodes are re-fetchable.
      models:
        existingClaim: comfyui-cache
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/models
                subPath: models
      custom-nodes:
        existingClaim: comfyui-cache
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/custom_nodes
                subPath: custom_nodes

      # Backed up via volsync - your actual creative assets: uploaded icons,
      # generated clips, and saved workflows.
      input:
        existingClaim: ${APP}
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/input
                subPath: input
      output:
        existingClaim: ${APP}
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/output
                subPath: output
      user:
        existingClaim: ${APP}
        advancedMounts:
          comfyui:
            app:
              - path: /root/ComfyUI/user
                subPath: user
