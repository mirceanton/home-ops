---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: kubesearch
  transport: http

  # Migrated from the app-template HelmRelease: the operator now runs this
  # workload. The CRD has no probes field, so the old /healthz liveness,
  # readiness and startup probes are dropped deliberately; the derived URL is
  # identical to the old spec.url.
  workload:
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.1.0
    port: 3000
    path: /mcp

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    automountServiceAccountToken: false

    # The PVC is not created by the CRD: it comes from the volsync component in
    # app.ks.yaml (ReplicationDestination kubesearch-mcp-dst), and must keep the
    # name ${APP} = kubesearch-mcp. Do not recreate it.
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kubesearch-mcp
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
