---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kubesearch-mcp
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: ai

  path: ./apps/ai/kubesearch-mcp/app
  components: []
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  decryption: { provider: sops }
  dependsOn:
    - name: external-secrets-operator
      namespace: security-system
    - name: 1password-connect
      namespace: security-system
    #? kubesearch-mcp is a LiteLLMMCPServer now: its CRD must exist first.
    - name: litellm-operator
      namespace: ai
