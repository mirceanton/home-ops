---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: github-mcp

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      github-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/github/github-mcp-server
              tag: v1.8.0@sha256:d5a18c04b92714c309eb46a2305087e91a4dbd80420f6e462656699f95093520
            args: ["http"]

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8082
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8082
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

          # Reverse proxy that injects the rotating GitHub App installation
          # token as an Authorization header. The token file is a live
          # (non-subPath) secret mount, refreshed in place by kubelet
          # roughly every ~60-90s after github-mcp-secret changes; a poll
          # loop rewrites an nginx include file and does `nginx -s reload`
          # (graceful, in-place) on change. This keeps the token current
          # without ever restarting this pod, so Hermes's long-lived
          # connection to this service never sees a rotation-driven
          # disconnect, and Hermes's own config no longer needs the token
          # at all.
          nginx:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.27-alpine

            command: ["sh", "/scripts/entrypoint.sh"]

            probes:
              liveness: &nginx_probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *nginx_probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

            securityContext:
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: github-mcp
        ports:
          http:
            port: 8080
            targetPort: 8080

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      github-token:
        type: secret
        name: github-mcp-secret
        defaultMode: 0400
        advancedMounts:
          github-mcp:
            nginx:
              - path: /run/secrets/github-mcp
                readOnly: true

      nginx-conf:
        type: configMap
        name: github-mcp-nginx-config
        advancedMounts:
          github-mcp:
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
              - path: /scripts/entrypoint.sh
                subPath: entrypoint.sh
                readOnly: true

      nginx-dynamic:
        type: emptyDir
        advancedMounts:
          github-mcp:
            nginx:
              - path: /etc/nginx/dynamic
