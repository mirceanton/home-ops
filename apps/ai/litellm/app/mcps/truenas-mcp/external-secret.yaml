---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name truenas-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    # TrueNAS SCALE API key. litellm sends it to the MCP server as the
    # Authorization bearer credential on every request (see authType and
    # authTokenRef on the LiteLLMMCPServer); the MCP server itself stores no
    # credential, so the key only ever reaches the litellm proxy's environment.
    - secretKey: TRUENAS_API_KEY
      remoteRef:
        key: "TrueNAS MCP"
        property: password
