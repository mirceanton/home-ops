---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.104.0
  replicas: 1

  applyMode: file
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/uri
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly
      port: 6379
    proxy_base_url: https://llm.home.mirceanton.com
    store_model_in_db: true
    store_prompts_in_spend_logs: true
    health_check_endpoint: /
    require_auth_for_metrics_endpoint: false
    prometheus_adapter: true

  # MCP clients use scoped gateway routes directly, so LiteLLM does not need
  # to build an embedding index or filter their tool definitions.
  litellmSettings:
    mcp_semantic_tool_filter:
      enabled: false

  routerSettings:
    num_retries: 2
    request_timeout: 600
    drop_params: true

  callbacks:
    success: [prometheus]
    failure: [prometheus]

  env:
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_LOCAL_MODEL_COST_MAP
      value: "False"
    - name: STORE_MODEL_IN_DB
      value: "True"
    - name: PROXY_BASE_URL
      value: https://llm.home.mirceanton.com
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens

    # Keycloak OIDC
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-secret
          key: client-id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-secret
          key: client-secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab/protocol/openid-connect/auth
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab/protocol/openid-connect/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab/protocol/openid-connect/userinfo
    - name: GENERIC_SCOPE
      value: openid profile email
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: PROXY_ADMIN_ID
      value: mirk

  envFrom:
    - secretRef: { name: litellm-secret }
    - secretRef: { name: litellm-oidc-secret }
    - secretRef: { name: litellm-postgres-app }

  volumes:
    - name: chatgpt-tokens
      persistentVolumeClaim:
        claimName: litellm-chatgpt-tokens

  volumeMounts:
    - name: chatgpt-tokens
      mountPath: /app/chatgpt_tokens

  resources:
    requests:
      cpu: 10m
      memory: 1126Mi
    limits:
      memory: 8Gi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  livenessProbe:
    httpGet:
      path: /
      port: 4000
    # MCP discovery and semantic indexing run before LiteLLM opens its HTTP port.
    initialDelaySeconds: 300
    periodSeconds: 10
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 5

  route:
    hostnames: ["llm.home.mirceanton.com"]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-internal
        namespace: network-system
