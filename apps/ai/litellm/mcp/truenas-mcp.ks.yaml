---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app truenas-mcp
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 10m
  targetNamespace: ai

  path: ./apps/ai/litellm/app/mcp/truenas-mcp
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: external-secrets-operator
      namespace: security-system
    - name: 1password-connect
      namespace: security-system
    - name: litellm-operator
      namespace: ai
    - name: litellm
      namespace: ai
