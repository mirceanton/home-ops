---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 30m
  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      karakeep:
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2
            envFrom:
              - secretRef: { name: karakeep-secret }
            env:
              # LLM auto-tagging/summarization, routed through the LiteLLM gateway.
              # No vision model is deployed, so OCR_USE_LLM stays off (Tesseract handles OCR).
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-litellm-secret
                    key: OPENAI_API_KEY
              INFERENCE_TEXT_MODEL: karakeep
              EMBEDDING_TEXT_MODEL: karakeep-embeddings
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: true
              BROWSER_WEB_URL: http://karakeep-chrome:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              CRAWLER_NUM_WORKERS: 4
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              DISABLE_PASSWORD_AUTH: true
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              MEILI_ADDR: http://karakeep-meilisearch:7700
              NEXTAUTH_URL: https://karakeep.home.mirceanton.com
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
              OAUTH_PROVIDER_NAME: Keycloak
              OAUTH_WELLKNOWN_URL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab/.well-known/openid-configuration
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-oidc-secret
                    key: client-id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-oidc-secret
                    key: client-secret

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

      chrome:
        containers:
          app:
            image:
              repository: docker.io/browserless/chrome
              tag: latest
            args: ["google-chrome-stable", "--no-sandbox", "--headless=new", "--disable-gpu", "--disable-dev-shm-usage", "--remote-debugging-port=9222", "--remote-debugging-address=0.0.0.0"]
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      app:
        controller: karakeep
        ports:
          http:
            port: 3000

    route:
      home:
        hostnames: ["karakeep.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /data

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
