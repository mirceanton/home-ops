---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-litellm-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-secrets
    kind: SecretStore
  target:
    name: karakeep-litellm-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: karakeep-litellm-key
        property: key
