---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: navidrome-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: navidrome
  transport: http

  # Migrated from the app-template HelmRelease: the operator now runs this
  # workload. The CRD has no probes field, so the old /healthz liveness and
  # readiness probes are dropped deliberately; nothing else about the runtime
  # changed and the derived URL is identical to the old spec.url.
  workload:
    image: ghcr.io/blakeem/navidrome-mcp:2.3.0
    port: 3000
    path: /mcp

    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: { type: RuntimeDefault }

    automountServiceAccountToken: false

    # settings.json (navidrome url + credentials) comes from this Secret, which
    # is templated by the ExternalSecret of the same name in this directory.
    volumes:
      - name: config
        secret:
          secretName: navidrome-mcp-secret
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: config
        mountPath: /config
        readOnly: true
      - name: tmp
        mountPath: /tmp
