---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name youtube-public-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # 1Password item "YouTube Public MCP" with a single field "api_key":
  # a Google Cloud API key (no OAuth) scoped to the YouTube Data API v3
  # only. This key can never write anything, so it's the right boundary
  # for the "read-only" public/competitor-research server.
  data:
    - secretKey: YOUTUBE_API_KEY
      remoteRef:
        key: YouTube Public MCP
        property: api_key
    - secretKey: MCP_API_KEY
      remoteRef:
        key: YouTube Public MCP
        property: mcp_bearer_token
