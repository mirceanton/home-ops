---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: youtube

resources:
  - ./namespace.yaml
  - ./davinci
  # Standalone MCP servers whose manifests live under apps/ai/litellm/app/mcp/.
  # Their Flux Kustomizations stay in this namespace tree so the Kustomization
  # object keeps its identity (namespace == targetNamespace) and Flux does not
  # prune the live workloads on the move.
  - ./mcp
  - ./teleprompter
