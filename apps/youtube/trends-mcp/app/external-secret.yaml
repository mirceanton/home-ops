---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trends-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # 1Password item "Trends MCP" with a single field "api_key": a free
  # HasData API key (dashboard.hasdata.com, no card required, ~200
  # Google Trends calls/mo on the free tier). There is no real
  # self-hosted/open Google Trends scraper worth trusting long-term
  # (Google changes the internal endpoints regularly) — this hits
  # HasData's hosted API instead, same as every other trends-mcp
  # option surveyed. Swap the key/URL here if a paid tier is needed.
  data:
    - secretKey: HASDATA_API_KEY
      remoteRef:
        key: Trends MCP
        property: api_key
