worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log /dev/stderr;
  client_max_body_size 0;

  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 10s;

  server {
    listen 8080;

    # HasData's Google Trends MCP endpoint speaks streamable HTTP at this
    # single path (both the SSE-style GET stream and JSON-RPC POSTs land
    # here). We pin the upstream query string so callers never need to
    # know which HasData sub-API this proxy is wired to.
    location /mcp {
      include /etc/nginx/dynamic/auth.conf;

      proxy_pass https://mcp.hasdata.com/api/mcp?apis=google_trends;
      proxy_ssl_server_name on;
      proxy_set_header Host mcp.hasdata.com;
      proxy_http_version 1.1;
      proxy_set_header x-api-key $hasdata_api_key;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /healthz {
      return 200 "ok\n";
    }
  }
}
