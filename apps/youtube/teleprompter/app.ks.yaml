---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app teleprompter
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: youtube

  path: ./apps/youtube/teleprompter/app
  components:
    - ../../../../components/keycloak-client/
    - ../../../../components/volsync/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi

  decryption: { provider: sops }
  dependsOn:
    - name: keycloak-operator-config
      namespace: security-system
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
