---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app youtube-workspace
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: youtube-workspace

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      youtube-workspace:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/mirceanton/youtube-workspace
              tag: v0.3.1

            env:
              # The CNPG app role owns the database, which is what the app needs: it runs its own
              # migrations on boot. It is not a superuser, so the query_sql MCP tool stays enabled.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: youtube-workspace-postgres-app
                    key: uri
              LOG_LEVEL: info

              # The LiteLLM bearer token. The app reconciles it on every boot: a changed secret
              # replaces the old token, so rotating the Secret rotates the token.
              MCP_BOOTSTRAP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: youtube-workspace-mcp-token
                    key: MCP_BOOTSTRAP_TOKEN
              MCP_BOOTSTRAP_TOKEN_NAME: litellm

              # OIDC / Keycloak SSO. With these unset the app would run without any login, so all
              # of them (and SESSION_SECRET) are set. The first user to sign in becomes admin.
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: youtube-workspace-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: youtube-workspace-oidc-secret
                    key: client-secret
              OIDC_ISSUER_URL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
              OIDC_REDIRECT_URI: https://youtube-workspace.home.mirceanton.com/auth/callback
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: youtube-workspace-session-secret
                    key: password

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /readyz
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5

            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    global:
      createDefaultServiceAccount: false

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      home:
        hostnames: ["youtube-workspace.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    service:
      app:
        controller: youtube-workspace
        ports:
          http:
            port: 3000
