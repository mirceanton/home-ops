# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes-postgres-mcp
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: youtube

  path: ./apps/youtube/hermes-postgres-mcp/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  decryption: { provider: sops }
  dependsOn:
    - name: external-secrets-operator
      namespace: security-system
    - name: 1password-connect
      namespace: security-system
    - name: cloudnative-pg-operator
      namespace: database-system
    - name: cloudnative-pg-plugins
      namespace: database-system
    - name: hermes-postgres
      namespace: youtube
