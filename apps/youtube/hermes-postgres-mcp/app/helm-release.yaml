# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-postgres-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: hermes-postgres-mcp

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      hermes-postgres-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: node
              tag: 20-alpine

            command: /bin/sh
            args:
              - -c
              - |
                npm install -g @calebmabry/postgres-mcp-server@0.1.5
                exec postgres-mcp-http

            env:
              MODE: http
              PORT: "3000"
              DB_HOST: hermes-postgres-postgres-rw.youtube.svc.cluster.local
              DB_PORT: "5432"
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: hermes-postgres-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-postgres-app
                    key: password
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: hermes-postgres-app
                    key: dbname
              READ_ONLY: "false"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: hermes-postgres-mcp
        ports:
          http:
            port: 3000

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
