---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: youtube-exporter
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: youtube-exporter

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      youtube-exporter:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: ghcr.io/mirceanton/youtube-exporter
              tag: v0.1.0

            env:
              YOUTUBE_EXPORTER_PORT: &port 8080
              YOUTUBE_EXPORTER_CHANNEL_ID:
                valueFrom:
                  secretKeyRef:
                    name: youtube-exporter-secret
                    key: CHANNEL_ID
              YOUTUBE_EXPORTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: youtube-exporter-secret
                    key: API_KEY

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness: *probe

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      youtube-exporter:
        controller: youtube-exporter
        ports:
          http:
            port: *port

    serviceMonitor:
      youtube-exporter:
        serviceName: youtube-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 5m
            scrapeTimeout: 30s
