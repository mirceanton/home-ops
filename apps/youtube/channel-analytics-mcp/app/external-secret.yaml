---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name channel-analytics-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # 1Password item "YouTube Channel Analytics MCP" — a Google Cloud OAuth
  # client (Desktop app type) plus a refresh token minted ONCE, out of
  # band, by running the OAuth consent flow locally and granting only:
  #   - https://www.googleapis.com/auth/youtube.readonly
  #   - https://www.googleapis.com/auth/yt-analytics.readonly
  # Do NOT grant youtube.force-ssl or youtube.upload — those are what
  # let the underlying tools post comments / edit videos / upload
  # thumbnails. Scoping the refresh token is the actual read-only
  # enforcement point; the MCP server itself still exposes write tools
  # regardless of scope, they'll just fail against Google's API.
  data:
    - secretKey: YOUTUBE_OAUTH_CLIENT_ID
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_id
    - secretKey: YOUTUBE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_secret
    - secretKey: YOUTUBE_OAUTH_REFRESH_TOKEN
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: refresh_token
    - secretKey: MCP_API_KEY
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: mcp_bearer_token
