---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name channel-analytics-mcp-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # 1Password item "YouTube Channel Analytics MCP" — a Google Cloud OAuth
  # client (Desktop app type) plus a refresh token minted ONCE, out of
  # band. oliverhruby/youtube-mcp's default OAUTH_SCOPES (src/youtube_mcp
  # /__init__.py) is:
  #   youtube.readonly, youtube (full read/write),
  #   yt-analytics.readonly, yt-analytics-monetary.readonly (revenue)
  # When running its `auth_start` tool (or building the consent URL by
  # hand), pass scopes_csv to grant only:
  #   https://www.googleapis.com/auth/youtube.readonly
  #   https://www.googleapis.com/auth/yt-analytics.readonly
  # i.e. explicitly leave out the plain "youtube" scope — that's the one
  # that grants write access (edit videos, post comments, set
  # thumbnails). Add yt-analytics-monetary.readonly too if revenue data
  # is wanted. Scoping the refresh token is the actual read-only
  # enforcement point; the MCP server itself still exposes write tools
  # regardless of scope, they'll just fail against Google's API.
  # secretKey names below match the env vars read directly from
  # src/youtube_mcp/__init__.py (YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
  # / YOUTUBE_REFRESH_TOKEN — no "OAUTH_" infix).
  data:
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_id
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: client_secret
    - secretKey: YOUTUBE_REFRESH_TOKEN
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: refresh_token
    - secretKey: MCP_API_KEY
      remoteRef:
        key: YouTube Channel Analytics MCP
        property: mcp_bearer_token
