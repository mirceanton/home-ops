---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./external-secret.yaml
  - ./helm-release.yaml
  - ./oci-repository.yaml
  - ./scrape-config.yaml

configMapGenerator:
  - name: telegraf-config
    files:
      - telegraf.conf=./files/telegraf.conf

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
