---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telegraf
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: telegraf

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      telegraf:
        annotations:
          # The telegraf.conf ConfigMap is generated by kustomize with a stable name
          # (disableNameSuffixHash), so config changes need reloader to roll the pod.
          reloader.stakater.com/auto: "true"

        containers:
          telegraf:
            image:
              repository: docker.io/library/telegraf
              tag: 1.32.3
            envFrom:
              - secretRef: { name: telegraf-mqtt-auth }
            env:
              TZ: Europe/Bucharest
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      metrics:
        controller: telegraf
        ports:
          http:
            port: 9273

    persistence:
      config:
        type: configMap
        name: telegraf-config
        globalMounts:
          - path: /etc/telegraf/telegraf.conf
            subPath: telegraf.conf
            readOnly: true
