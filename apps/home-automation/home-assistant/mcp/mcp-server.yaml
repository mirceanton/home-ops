---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: home-assistant-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: home_assistant
  transport: http

  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:8.6.0@sha256:7426fb169440aff789e4ee942012b03317ba0b68e1d463efa19c37088dddd8bc
    args: [ha-mcp-web]
    port: 8086
    env:
      - name: TZ
        value: Europe/Bucharest
      - name: MCP_PORT
        value: "8086"
      - name: MCP_SECRET_PATH
        value: /mcp
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-automation.svc.cluster.local:8123
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: home-assistant-mcp-secret
            key: HOMEASSISTANT_TOKEN

    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 512Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
