---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: home-automation

  path: ./apps/home-automation/home-assistant/app
  components:
    - ../../../../components/volsync/
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
      KEYCLOAK_CLIENT_REDIRECT_URL: "https://homeassistant.home.mirceanton.com/*"
      KEYCLOAK_CLIENT_WEB_ORIGIN: "https://homeassistant.home.mirceanton.com"
      KEYCLOAK_CLIENT_HOME_URL: "https://homeassistant.home.mirceanton.com"

  decryption: { provider: sops }
  dependsOn:
    - name: zigbee2mqtt
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
