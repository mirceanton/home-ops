---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-world
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: jobs

  path: ./apps/jobs/hello-world/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute: {}

  decryption: { provider: sops }
  dependsOn:
    - name: argo-workflows
      namespace: jobs
