---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: ./namespaces is intentionally NOT listed here. That tree holds Kestra flow definitions,
# which Kestra itself pulls from Git via NamespaceSync (see app/flows/git-sync.yaml) - Flux never
# applies them.
resources:
  - ./app.ks.yaml
