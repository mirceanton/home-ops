# Git-owned flow, synced into Kestra by the system.git-sync flow. Edit here, not in the Kestra UI.
#
# Reusable Terragrunt drift detection for a Terraform repo (port of the repos' GitHub Actions
# `terragrunt-drift.yaml`): clone, install the repo's own mise-locked tools, resolve `.env.1pass`
# through 1Password Connect, `terragrunt run --all -- plan --detailed-exitcode`, then open/refresh
# and pin (drift) or close and unpin (no drift) the "Terragrunt Drift Detected" issue using the
# repo's own `.github/scripts/generate-comment.py`. Scheduled per repo by the *-drift flows.
#
# Credentials (apps/jobs/kestra/app/terragrunt.yaml): kestra-terragrunt-op (OP_CONNECT_*) and
# kestra-github-token (GITHUB_TOKEN, a Mr Borboto GitHub App installation token).
id: terragrunt-drift
namespace: homelab.infrastructure
description: Detect Terragrunt drift in a repo and track it in a GitHub issue

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository URL
    defaults: https://github.com/mirceanton/mikrotik-terraform
  - id: branch
    type: STRING
    defaults: main

variables:
  slug: "{{ inputs.repository | replace({'https://github.com/': '', '.git': ''}) }}"
  run_url: "{{ kestra.url }}ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
  issue_title: "⚠️ Terragrunt Drift Detected ⚠️"

concurrency:
  limit: 1 # one plan at a time (they share the network gear / NAS); overlapping runs wait
  behavior: QUEUE

tasks:
  - id: plan
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: jobs
    waitForLogInterval: PT5S
    waitRunning: PT1H
    metadata:
      labels: { app.kubernetes.io/name: terragrunt-drift, app.kubernetes.io/managed-by: kestra }
    outputFiles:
      - plan_output.txt
      - issue_body.txt
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      containers:
        - name: terragrunt
          image: jdxcode/mise:2026.9.17-debian
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              git clone --quiet --depth 1 --branch "$BRANCH" "$REPOSITORY" /work/repo
              cd /work/repo
              echo "Checked out $(git rev-parse --short HEAD) of $REPOSITORY@$BRANCH"

              # The repo's own tool versions, from its mise.lock
              mise trust --quiet
              mise install --quiet opentofu terragrunt op uv
              eval "$(mise env --shell bash)"

              # Secrets from .env.1pass via 1Password Connect; `op run` also masks them in output
              for attempt in 1 2 3; do
                op run --env-file .env.1pass -- terragrunt run --all --non-interactive -- init -upgrade && break
                [ "$attempt" = 3 ] && exit 1
                echo "init attempt $attempt failed, retrying in 15s"; sleep 15
              done

              for attempt in 1 2 3; do
                set +e
                op run --env-file .env.1pass -- terragrunt run --all --non-interactive --no-color -- plan --detailed-exitcode 2>&1 | tee plan_output.txt
                TG_EXIT="${PIPESTATUS[0]}"
                set -e
                case "$TG_EXIT" in 0|2) break ;; esac
                [ "$attempt" = 3 ] && { echo "terragrunt plan failed with exit code $TG_EXIT" >&2; exit "$TG_EXIT"; }
                echo "plan attempt $attempt failed (exit $TG_EXIT), retrying in 15s"; sleep 15
              done
              DRIFT=$([ "$TG_EXIT" = 2 ] && echo true || echo false)

              uv run --quiet .github/scripts/generate-comment.py plan_output.txt issue_body.txt drift
              cp plan_output.txt issue_body.txt "$WORKING_DIR/"
              echo "::{\"outputs\":{\"drift\":$DRIFT}}::"
          env:
            - { name: REPOSITORY, value: "{{ inputs.repository }}" }
            - { name: BRANCH, value: "{{ inputs.branch }}" }
            - { name: WORKING_DIR, value: "{{ workingDir }}" }
            # read by the repo's comment.j2 template
            - { name: RUN_NUMBER, value: "{{ execution.id }}" }
            - { name: RUN_URL, value: "{{ render(vars.run_url) }}" }
            - { name: HOME, value: /work }
            - { name: MISE_DATA_DIR, value: /work/.mise }
            - { name: MISE_YES, value: "1" }
          envFrom:
            - secretRef: { name: kestra-terragrunt-op } # OP_CONNECT_HOST, OP_CONNECT_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: {} }

  - id: issue
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: jobs
    waitForLogInterval: PT5S
    metadata:
      labels: { app.kubernetes.io/name: terragrunt-drift, app.kubernetes.io/managed-by: kestra }
    inputFiles:
      issue_body.txt: "{{ outputs.plan.outputFiles['issue_body.txt'] }}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      containers:
        - name: gh
          image: jdxcode/mise:2026.9.17-debian
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              # gh at the version the repo pins
              git clone --quiet --depth 1 --branch "$BRANCH" "$REPOSITORY" /work/repo
              cd /work/repo && mise trust --quiet && mise install --quiet gh && eval "$(mise env --shell bash)"
              export GH_REPO="$SLUG"

              if [ "$DRIFT" = true ]; then
                ISSUE_NUMBER=$(gh issue list --state all --search "$ISSUE_TITLE" --json number --jq '.[0].number')
                if [ -n "$ISSUE_NUMBER" ]; then
                  gh issue reopen "$ISSUE_NUMBER" || true # already open
                  gh issue edit "$ISSUE_NUMBER" --body-file "$WORKING_DIR/issue_body.txt"
                else
                  gh issue create --title "$ISSUE_TITLE" --body-file "$WORKING_DIR/issue_body.txt"
                  ISSUE_NUMBER=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number')
                fi
                gh issue pin "$ISSUE_NUMBER" || true # already pinned
                echo "Drift detected: https://github.com/$SLUG/issues/$ISSUE_NUMBER"
              else
                ISSUE_NUMBER=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number')
                if [ -n "$ISSUE_NUMBER" ]; then
                  gh issue close "$ISSUE_NUMBER" --comment "✅ No drift detected. Closing issue automatically.
              Verified in [Kestra execution $EXECUTION_ID]($RUN_URL)."
                  gh issue unpin "$ISSUE_NUMBER" || true
                  echo "No drift: closed https://github.com/$SLUG/issues/$ISSUE_NUMBER"
                else
                  echo "No drift, no open drift issue"
                fi
              fi
          env:
            - { name: REPOSITORY, value: "{{ inputs.repository }}" }
            - { name: BRANCH, value: "{{ inputs.branch }}" }
            - { name: SLUG, value: "{{ render(vars.slug) }}" }
            - { name: DRIFT, value: "{{ outputs.plan.vars.drift }}" }
            - { name: ISSUE_TITLE, value: "{{ vars.issue_title }}" }
            - { name: EXECUTION_ID, value: "{{ execution.id }}" }
            - { name: RUN_URL, value: "{{ render(vars.run_url) }}" }
            - { name: WORKING_DIR, value: "{{ workingDir }}" }
            - { name: HOME, value: /work }
            - { name: MISE_DATA_DIR, value: /work/.mise }
            - { name: MISE_YES, value: "1" }
          envFrom:
            - secretRef: { name: kestra-github-token } # GITHUB_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
