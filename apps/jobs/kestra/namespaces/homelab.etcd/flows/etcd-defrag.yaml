# Git-owned flow, synced into Kestra by the system.git-sync flow. Edit here, not in the Kestra UI.
#
# Defragments the etcd database on a control-plane node via the Talos API, with an etcd status
# check before (fails fast on an unhealthy member) and after (shows the reclaimed DB size).
# Run for all control-plane nodes, one at a time, by etcd-defrag-all.
#
# Kestra 2.0 OSS has no pluginDefaults, so the pod settings are repeated inline per task.
id: etcd-defrag
namespace: homelab.etcd
description: Defragment etcd on a Talos control-plane node

inputs:
  - id: node
    type: SELECT
    displayName: Control-plane node
    expression: "{{ kv('etcd_nodes', errorOnMissing=false) ?? [] }}" # refreshed by etcd-discover
    allowCustomValue: true

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  # Resolve the node's InternalIP for talosctl --nodes (and make sure it is a control-plane node)
  - id: nodes
    type: io.kestra.plugin.kubernetes.kubectl.Get
    namespace: ""
    apiVersion: v1
    resourceType: nodes
    fetchType: FETCH

  - id: node_ip
    type: io.kestra.plugin.core.output.OutputValues
    values:
      ip: >-
        {% for m in outputs.nodes.metadataItems %}{% if m.name == inputs.node and (m.labels['node-role.kubernetes.io/control-plane'] ?? 'NO') != 'NO' %}{% for a in outputs.nodes.statusItems[loop.index].status.addresses %}{% if a.type == 'InternalIP' %}{{ a.address }}{% endif %}{% endfor %}{% endif %}{% endfor %}

  - id: check_node
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ (outputs.node_ip.values.ip ?? '') is empty }}"
    errorMessage: "'{{ inputs.node }}' is not a control-plane node with an InternalIP"

  - id: pre-status
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: jobs
    waitForLogInterval: PT5S
    metadata:
      labels: { app.kubernetes.io/name: etcd-defrag, app.kubernetes.io/managed-by: kestra }
    containerDefaultSpec:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 128Mi }
    spec:
      automountServiceAccountToken: false # talks to the Talos API only, never the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      containers:
        - name: talosctl
          image: ghcr.io/siderolabs/talosctl:v1.14.1
          args:
            - --talosconfig=/var/run/secrets/talos.dev/config
            - "--nodes={{ outputs.node_ip.values.ip }}"
            - etcd
            - status
          volumeMounts:
            - { name: talos, mountPath: /var/run/secrets/talos.dev, readOnly: true }
      volumes:
        - name: talos
          secret: { secretName: kestra-talos } # apps/jobs/kestra/app/talos-service-account.yaml

  - id: defrag
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: jobs
    waitForLogInterval: PT5S
    metadata:
      labels: { app.kubernetes.io/name: etcd-defrag, app.kubernetes.io/managed-by: kestra }
    containerDefaultSpec:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 128Mi }
    spec:
      automountServiceAccountToken: false # talks to the Talos API only, never the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      containers:
        - name: talosctl
          image: ghcr.io/siderolabs/talosctl:v1.14.1
          args:
            - --talosconfig=/var/run/secrets/talos.dev/config
            - "--nodes={{ outputs.node_ip.values.ip }}"
            - etcd
            - defrag
          volumeMounts:
            - { name: talos, mountPath: /var/run/secrets/talos.dev, readOnly: true }
      volumes:
        - name: talos
          secret: { secretName: kestra-talos } # apps/jobs/kestra/app/talos-service-account.yaml

  - id: post-status
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: jobs
    waitForLogInterval: PT5S
    metadata:
      labels: { app.kubernetes.io/name: etcd-defrag, app.kubernetes.io/managed-by: kestra }
    containerDefaultSpec:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 128Mi }
    spec:
      automountServiceAccountToken: false # talks to the Talos API only, never the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      containers:
        - name: talosctl
          image: ghcr.io/siderolabs/talosctl:v1.14.1
          args:
            - --talosconfig=/var/run/secrets/talos.dev/config
            - "--nodes={{ outputs.node_ip.values.ip }}"
            - etcd
            - status
          volumeMounts:
            - { name: talos, mountPath: /var/run/secrets/talos.dev, readOnly: true }
      volumes:
        - name: talos
          secret: { secretName: kestra-talos } # apps/jobs/kestra/app/talos-service-account.yaml

