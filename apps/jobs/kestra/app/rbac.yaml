---
# Lets Kestra's io.kestra.plugin.kubernetes.core.PodCreate tasks run job pods in this namespace
# using the in-cluster ServiceAccount token (the Kubernetes *task runner* is EE-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kestra-pod-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"] # inputFiles/outputFiles transfer via the init/sidecar containers
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"] # surfaced in the task logs when a job pod fails
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kestra-pod-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestra-pod-runner
subjects:
  - kind: ServiceAccount
    name: kestra
---
# Read-only node access, e.g. for flows that derive the Talos version from `nodeInfo.osImage`
# with io.kestra.plugin.kubernetes.kubectl.Get.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kestra-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kestra-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kestra-node-reader
subjects:
  - kind: ServiceAccount
    name: kestra
    namespace: jobs
