---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kestra-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # Kestra OSS always requires basic auth (no OIDC/RBAC outside EE). Seeding it from config skips
  # the public first-run Setup page, and Kestra 2.0 derives the credentials its own SDK-based tasks
  # (NamespaceSync) use to call the API from this same setting.
  data:
    - secretKey: KESTRA_SERVER_BASIC_AUTH_USERNAME
      remoteRef:
        key: &opItem Kestra
        property: username
    - secretKey: KESTRA_SERVER_BASIC_AUTH_PASSWORD
      remoteRef:
        key: *opItem
        property: password
