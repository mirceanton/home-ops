---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kestra-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  # Kestra OSS always requires basic auth (no OIDC/RBAC outside EE). Seeding it from config skips
  # the public first-run Setup page, and Kestra 2.0 derives the credentials its own SDK-based tasks
  # (NamespaceSync) use to call the API from this same setting.
  data:
    - secretKey: KESTRA_SERVER_BASIC_AUTH_USERNAME
      remoteRef:
        key: &opItem Kestra
        property: username
    - secretKey: KESTRA_SERVER_BASIC_AUTH_PASSWORD
      remoteRef:
        key: *opItem
        property: password
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
# Pre-rendered `Authorization` header value the gateway injects into every request (see
# http-route.yaml), so users who passed Keycloak SSO are not asked for Kestra's basic auth too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kestra-gateway-auth
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credential: 'Basic {{ printf "%s:%s" .username .password | b64enc }}'

  data:
    - secretKey: username
      remoteRef:
        key: &opItem Kestra
        property: username
    - secretKey: password
      remoteRef:
        key: *opItem
        property: password
