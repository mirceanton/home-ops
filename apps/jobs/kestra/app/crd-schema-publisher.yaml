---
# Dependencies of the homelab/crd-schema-publisher flow: the job pod's ServiceAccount (cluster-wide
# read on CRDs) and the Cloudflare Pages credentials it deploys with.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kestra-crd-schema-publisher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kestra-crd-schema-publisher
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kestra-crd-schema-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kestra-crd-schema-publisher
subjects:
  - kind: ServiceAccount
    name: kestra-crd-schema-publisher
    namespace: jobs
---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kestra-crd-schema-publisher
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: &opItem CRD Schemas - Cloudflare Token
        property: password
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: *opItem
        property: username
