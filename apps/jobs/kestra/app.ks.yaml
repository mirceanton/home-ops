---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kestra
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: jobs

  path: ./apps/jobs/kestra/app
  components:
    - ../../../../components/cnpg/
    - ../../../../components/volsync/
    - ../../../../components/oidc/
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"

  decryption: { provider: sops }
  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: cloudnative-pg-operator
      namespace: database-system
    - name: cloudnative-pg-plugins
      namespace: database-system
    - name: external-secrets-operator
      namespace: security-system
    - name: keycloak-operator-config
      namespace: security-system
    - name: openebs
      namespace: storage-system
    - name: volsync
      namespace: storage-system
