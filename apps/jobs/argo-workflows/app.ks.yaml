---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app argo-workflows
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: jobs

  path: ./apps/jobs/argo-workflows/app
  components:
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      KEYCLOAK_CLIENT_REDIRECT_URLS: '["https://argo-workflows.admin.mirceanton.com/oauth2/callback"]'
      KEYCLOAK_CLIENT_WEB_ORIGINS: '["https://argo-workflows.admin.mirceanton.com"]'
      KEYCLOAK_CLIENT_HOME_URL: "https://argo-workflows.admin.mirceanton.com"

  decryption: { provider: sops }
  dependsOn:
    - name: keycloak-operator-config
      namespace: security-system
