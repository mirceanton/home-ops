---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: argo-workflows

  values:
    fullnameOverride: argo-workflows

    # =============================================================================================
    # CRDs - installed automatically via the chart's pre-install/pre-upgrade hook Job
    # =============================================================================================
    crds:
      install: true

    # Namespace-scoped Role/RoleBinding instead of cluster-wide ClusterRole/ClusterRoleBinding -
    # the controller only ever watches/runs workflows in this namespace (jobs).
    singleNamespace: true

    # =============================================================================================
    # Component - Controller
    # =============================================================================================
    controller:
      podSecurityContext:
        seccompProfile: { type: RuntimeDefault }

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: { drop: ["ALL"] }

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

      metricsConfig:
        serviceMonitor:
          enabled: true

      # Run every workflow as the chart-managed SA below unless it sets its own
      workflowDefaults:
        spec:
          serviceAccountName: argo-workflow

    # =============================================================================================
    # Component - Workflow (SA + Role the step pods run as, to write their task results)
    # =============================================================================================
    workflow:
      serviceAccount:
        create: true
        name: argo-workflow

    # =============================================================================================
    # Component - Server (UI)
    # =============================================================================================
    server:
      secure: false # TLS is terminated at the envoy-admin Gateway, not the pod

      authModes: ["sso"]
      sso:
        enabled: true
        issuer: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
        clientId:
          name: ${APP}-oidc-secret
          key: client-id
        clientSecret:
          name: ${APP}-oidc-secret
          key: client-secret
        redirectUrl: https://${APP}.admin.mirceanton.com/oauth2/callback
        scopes: ["email", "profile", "groups"]
        rbac:
          enabled: false # single-operator cluster - logged-in users share the server's own RBAC

      podSecurityContext:
        seccompProfile: { type: RuntimeDefault }

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi

    # =============================================================================================
    # Component - Executor (sidecar injected into every workflow step pod)
    # =============================================================================================
    executor:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
