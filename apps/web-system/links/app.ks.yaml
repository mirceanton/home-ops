---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app links
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 3m
  targetNamespace: web-system

  path: ./apps/web-system/links/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  dependsOn:
    - name: envoy-gateway
      namespace: network-system
