---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: keep

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      keep:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          wait-for-postgres:
            image:
              repository: ghcr.io/wait4x/wait4x
              tag: 3.6.0
            args: ["postgresql", "$(DB_URL)"]
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: uri

        containers:
          app:
            image:
              repository: ghcr.io/zhfahim/anchor
              tag: v0.14.0

            envFrom:
              - secretRef: { name: keep-secret }
            env:
              # Application
              APP_URL: "https://keep.home.mirceanton.com"
              DATA_DIR: /data
              CORS_ORIGINS: "https://keep.home.mirceanton.com"
              USER_SIGNUP: disabled
              # Authentication
              DISABLE_INTERNAL_AUTH: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: "Keycloak"
              OIDC_ISSUER_URL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: keep-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: keep-oidc-secret
                    key: client-secret
              # Postgres
              PG_HOST:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: host
              PG_PORT:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: port
              PG_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: dbname
              PG_USER:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: username
              PG_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: keep-postgres-app
                    key: password

            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30

            # The upstream image bundles postgres:18-alpine as its base and
            # supervisord.conf hardcodes `user=root` for process management,
            # so the container cannot run as a non-root user even though we
            # point it at an external CNPG cluster instead of the embedded one.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *port

    route:
      home:
        hostnames: ["keep.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run
