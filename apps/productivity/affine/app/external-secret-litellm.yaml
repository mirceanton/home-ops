---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-litellm-secret
  namespace: productivity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-secrets
    kind: SecretStore
  target:
    name: affine-litellm-secret
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: affine-litellm-key
        property: key
