---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: affine-mcp

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      affine-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dawncr0w/affine-mcp-server
              tag: "3.3.0"
            env:
              MCP_TRANSPORT: http
              PORT: "3000"
              AFFINE_MCP_HTTP_HOST: "0.0.0.0"
              AFFINE_MCP_AUTH_MODE: bearer
              AFFINE_BASE_URL: "http://affine.productivity.svc.cluster.local:3010"
              # cluster-internal traffic only, never leaves the pod network
              AFFINE_ALLOW_INSECURE_HTTP: "true"
              AFFINE_MCP_HTTP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: affine-mcp-secret
                    key: AFFINE_MCP_HTTP_TOKEN
              AFFINE_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: affine-mcp-secret
                    key: AFFINE_EMAIL
              AFFINE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: affine-mcp-secret
                    key: AFFINE_PASSWORD

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: affine-mcp
        ports:
          http:
            port: 3000

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
