---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app headlamp
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: flux-system

  path: ./apps/flux-system/headlamp/app
  components:
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      KEYCLOAK_CLIENT_REDIRECT_URLS: '["https://headlamp.admin.mirceanton.com/*"]'
      KEYCLOAK_CLIENT_WEB_ORIGINS: '["https://headlamp.admin.mirceanton.com"]'
      KEYCLOAK_CLIENT_HOME_URL: "https://headlamp.admin.mirceanton.com"

  dependsOn:
    - name: keycloak-operator-config
      namespace: security-system
