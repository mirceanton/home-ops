---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: headlamp

  values:
    fullnameOverride: headlamp

    podAnnotations:
      reloader.stakater.com/auto: "true"

    config:
      pluginsDir: /build/plugins
      oidc:
        secret:
          create: false
        issuerURL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
        scopes: "openid,email,profile,groups"
      extraArgs:
        - -oidc-client-id=$(OIDC_CLIENT_ID)
        - -oidc-client-secret=$(OIDC_CLIENT_SECRET)

    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.6.0
        command: ["/bin/sh", "-c"]
        args:
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins

    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins

    volumes:
      - name: headlamp-plugins
        emptyDir: {}

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # The headlamp chart's values.schema.json only allows literal `value:`
  # strings in the top-level `env` list (no valueFrom), so the OIDC client
  # credentials can't be wired to headlamp-oidc-secret via values. Inject
  # them with a post-render patch instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: headlamp
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: headlamp
              spec:
                template:
                  spec:
                    containers:
                      - name: headlamp
                        env:
                          - name: OIDC_CLIENT_ID
                            valueFrom:
                              secretKeyRef:
                                name: headlamp-oidc-secret
                                key: client-id
                          - name: OIDC_CLIENT_SECRET
                            valueFrom:
                              secretKeyRef:
                                name: headlamp-oidc-secret
                                key: client-secret
