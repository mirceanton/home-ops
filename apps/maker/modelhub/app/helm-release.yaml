---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: modelhub
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: modelhub

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # Playwright's official base image (this app bundles headless
        # Chromium for thumbnails) fixes its non-root user at 1001 (pwuser),
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      modelhub:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/mirceanton/model-hub
              tag: v0.1.0@sha256:6cad54a9181cb5cca2111608821708987b1a4a7a72589de4ff4914f85f1fea61

            env:
              PORT: &port 4000
              LIBRARY_ROOT: /library
              DATABASE_PATH: /data/modelhub.sqlite3
              LIBRARY_WATCH_USE_POLLING: "true" #? library is an NFS mount; inotify is unreliable across NFS
              WEB_BASE_URL: https://modelhub.home.mirceanton.com

              # OIDC / Keycloak SSO
              OIDC_ISSUER_URL: https://keycloak.nas.svc.h.mirceanton.com/realms/Homelab
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: modelhub-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: modelhub-oidc-secret
                    key: client-secret
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: modelhub-session-secret
                    key: password

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        controller: modelhub
        ports:
          http:
            port: *port

    route:
      home:
        hostnames: ["modelhub.home.mirceanton.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network-system

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /data

      library:
        type: nfs
        server: nas.stor.h.mirceanton.com
        path: /mnt/tank/Media/3D_Models
        globalMounts:
          - path: /library

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      # Chromium crashes under Kubernetes' tiny default /dev/shm (64Mi).
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
