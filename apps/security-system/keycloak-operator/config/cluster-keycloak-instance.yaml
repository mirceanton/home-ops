---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/clusterkeycloakinstance_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: ClusterKeycloakInstance
metadata:
  name: homelab
spec:
  baseUrl: https://keycloak.nas.svc.h.mirceanton.com
  realm: master

  auth:
    passwordGrant:
      secretRef:
        name: keycloak-admin-credentials
        namespace: security-system
        usernameKey: username
        passwordKey: password

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/clusterkeycloakrealm_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: ClusterKeycloakRealm
metadata:
  name: homelab
spec:
  clusterInstanceRef:
    name: homelab

  realmName: Homelab
  definition:
    realm: Homelab

    # Defines the "groups" client scope + mapper only - it is NOT added to
    # defaultDefaultClientScopes here. Assignment happens per-client instead,
    # via each KeycloakClient's own defaultClientScopes (see the keycloak-client
    # component), since that applies to existing clients too and doesn't
    # require keeping this realm-wide list in sync with it.
    clientScopes:
      - name: groups
        protocol: openid-connect
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
