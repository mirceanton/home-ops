---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/clusterkeycloakinstance_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: ClusterKeycloakInstance
metadata:
  name: homelab
spec:
  baseUrl: https://keycloak.nas.svc.h.mirceanton.com
  realm: master

  auth:
    passwordGrant:
      secretRef:
        name: keycloak-admin-credentials
        namespace: security-system
        usernameKey: username
        passwordKey: password

---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/clusterkeycloakrealm_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: ClusterKeycloakRealm
metadata:
  name: homelab
spec:
  clusterInstanceRef:
    name: homelab

  realmName: Homelab
  definition:
    realm: Homelab

    # NOTE: `definition` is a verbatim passthrough to Keycloak's RealmRepresentation
    # API - the operator doesn't merge/append into list fields, it replaces them.
    # `defaultDefaultClientScopes` below is therefore the FULL desired list, not
    # an addition to it: it must include Keycloak's built-in OIDC defaults
    # (profile, email, roles, web-origins, acr) or every client in the realm
    # silently loses them. Double-check these against Client Scopes > Default
    # in the admin console before merging, in case anything else was added
    # there manually since.
    clientScopes:
      - name: groups
        protocol: openid-connect
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups

    defaultDefaultClientScopes:
      - profile
      - email
      - roles
      - web-origins
      - acr
      - groups
