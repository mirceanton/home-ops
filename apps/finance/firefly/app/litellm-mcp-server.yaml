---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: firefly-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: firefly
  transport: sse

  authType: bearer_token
  authTokenRef:
    name: firefly-mcp-secret
    key: FIREFLY_MCP_TOKEN

  # Migrated from the app-template HelmRelease: the operator now runs this
  # workload. The CRD has no probes field, so the old liveness/readiness/startup
  # probes are dropped deliberately.
  workload:
    image: ghcr.io/daften/fireflyiii-mcp:0.5.2
    port: 3000
    # The old spec.url carried no path at all (the server speaks SSE from the
    # root), and the CRD always appends a path to the derived URL. `path: "/"`
    # reproduces `http://firefly-mcp.finance.svc.cluster.local:3000/`, which is
    # the same request the old `...:3000` produced.
    path: "/"

    env:
      # PAT-only HTTP mode: the token is forwarded by litellm as a Bearer
      # header (see the authTokenRef of this CR), not configured here.
      - name: FIREFLY_URL
        value: http://firefly:8080

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch

    automountServiceAccountToken: false

    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
