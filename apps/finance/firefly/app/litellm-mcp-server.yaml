---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: firefly-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: firefly
  transport: sse

  authType: bearer_token
  authTokenRef:
    name: firefly-mcp-secret
    key: FIREFLY_MCP_TOKEN

  workload:
    image: ghcr.io/daften/fireflyiii-mcp:0.5.2
    port: 3000
    path: "/"

    env:
      - name: FIREFLY_URL
        value: http://firefly:8080

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch

    automountServiceAccountToken: false

    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
