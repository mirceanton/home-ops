---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-alerts
spec:
  groups:
    - name: truenas
      rules:
        # -----------------------------------------------------------------------
        # Availability
        # -----------------------------------------------------------------------
        - alert: NASDown
          expr: up{job="node-exporter", node_type="nas"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NAS {{ $labels.instance }} is unreachable"
            description: "No metrics received from {{ $labels.instance }} for more than 2 minutes."

        # -----------------------------------------------------------------------
        # Containers
        # -----------------------------------------------------------------------
        - alert: NASContainerDown
          expr: time() - container_last_seen{job="cadvisor", name!=""} > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "NAS container {{ $labels.name }} is down"
            description: "cadvisor hasn't seen container {{ $labels.name }} ({{ $labels.image }}) for more than 5 minutes — it may have stopped or failed to restart."

        - alert: NASContainerDown
          expr: time() - container_last_seen{job="cadvisor", name!=""} > 90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NAS container {{ $labels.name }} is down (critical)"
            description: "cadvisor hasn't seen container {{ $labels.name }} ({{ $labels.image }}) for more than 10 minutes — it has likely stopped or failed to restart."
