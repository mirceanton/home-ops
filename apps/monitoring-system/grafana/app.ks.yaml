---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: monitoring-system

  path: ./apps/monitoring-system/grafana/app
  components:
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app

  dependsOn:
    #? wait for the 1password-connect secret store to be ready
    - name: 1password-connect
      namespace: security-system
    - name: grafana-operator
    - name: openebs
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
