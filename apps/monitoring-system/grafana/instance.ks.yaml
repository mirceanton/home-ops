---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: monitoring-system

  path: ./apps/monitoring-system/grafana/instance
  components:
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      #? this Kustomization is named "grafana-instance" (to disambiguate from
      #? the operator/mcp Kustomizations below it), but the Keycloak client
      #? itself should be identified as plain "grafana"
      APP: grafana
      #? Grafana lives on the "admin" subdomain, not "<app>.home.mirceanton.com"
      KEYCLOAK_CLIENT_HOME_URL: "https://grafana.admin.mirceanton.com"
      KEYCLOAK_CLIENT_REDIRECT_URLS: '["https://grafana.admin.mirceanton.com/*"]'
      KEYCLOAK_CLIENT_WEB_ORIGINS: '["https://grafana.admin.mirceanton.com"]'

  dependsOn:
    #? wait for the 1password-connect secret store to be ready
    - name: 1password-connect
      namespace: security-system
    - name: grafana-operator
    - name: openebs
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
