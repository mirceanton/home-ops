---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai

  alias: grafana
  transport: sse

  # Migrated from the app-template HelmRelease: the operator now runs this
  # workload. The CRD has no probes field, so the old liveness probe (a /healthz
  # httpGet that also sent `Host: localhost:8000`) is dropped deliberately; the
  # derived URL is identical to the old spec.url.
  workload:
    image: grafana/mcp-grafana:2.0.1
    port: 8000
    path: /sse
    # The service host and port in this allow-list are unchanged, so the list
    # stays valid: the operator's Service is still called grafana-mcp and still
    # listens on 8000.
    args:
      - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.monitoring-system.svc.cluster.local:8000,grafana-mcp.monitoring-system:8000,grafana-mcp:8000

    env:
      - name: GRAFANA_URL
        value: http://grafana-service:3000
      - name: GRAFANA_ORG_ID
        value: "1"
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: grafana-mcp-token
            key: token

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }

    # Grafana's API is reached with the token above, not with the pod's
    # ServiceAccount (service-account.yaml only mints that token).
    automountServiceAccountToken: false

    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
