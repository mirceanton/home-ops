---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rreading-glasses
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: rreading-glasses

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568

    controllers:
      rreading-glasses:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # CNPG's Database CR creates the DB/owner async — block until the
          # app's own database is actually reachable, same pattern as atuin.
          wait-for-postgres:
            image:
              repository: ghcr.io/wait4x/wait4x
              tag: 3.7.1
            args: ["postgresql", "$(DB_URL)"]
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-postgres-app
                    key: uri
        containers:
          app:
            image:
              repository: docker.io/blampe/rreading-glasses
              tag: hardcover@sha256:6db4551f77c038516b55dab689f3b473c2c5fdf8f13580b91a8ba39360c3d107
            command: ["/main", "serve"]
            args: ["--verbose"]
            env:
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-postgres-app
                    key: host
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-postgres-app
                    key: dbname
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-postgres-app
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-postgres-app
                    key: password
              HARDCOVER_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-hardcover
                    key: HARDCOVER_AUTH
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8788
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    # Internal-only metadata bridge for Bookshelf — no ingress route, no OIDC.
    service:
      app:
        ports:
          http:
            port: *port
