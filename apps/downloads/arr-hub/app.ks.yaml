---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app arr-hub
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: downloads

  path: ./apps/downloads/arr-hub/app
  components:
    - ../../../../components/volsync/
    - ../../../../components/keycloak-client/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 256Mi
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"

  decryption: { provider: sops }
  dependsOn:
    - name: 1password-connect
      namespace: security-system
    - name: volsync
      namespace: storage-system
    - name: keycloak-operator-config
      namespace: security-system
