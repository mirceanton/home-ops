---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name arr-hub-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: *name
    creationPolicy: Owner

  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: Arr Hub Session Secret
        property: password
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: Sonarr API Key
        property: password
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: Radarr API Key
        property: password
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: Lidarr API Key
        property: password
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: Bazarr API Key
        property: password
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: Prowlarr API Key
        property: password
