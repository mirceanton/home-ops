---
# Pin the kubelet and etcd to the ZimaBoard's Services VLAN address, and expose
# the controller-manager / scheduler metrics for Prometheus.
#
# ZimaBoard-local copy of the shared `../patches/network-binding.yaml`: that file
# is pinned to the 10.0.0.0/24 management subnet, which this node is not on. If
# the node ever moves to the management VLAN, the shared file can be reused
# verbatim instead.
#
# The subnet is the Services VLAN 1010 (`10.0.10.0/24`, `mikrotik-terraform`
# `dhcp/services`); the node's single address is the `10.0.10.195` on `bond0`
# (see ./zimaboard-bond.yaml). This filter must match an address the node
# actually has, otherwise the kubelet/etcd come up without a node IP.
machine:
  kubelet:
    nodeIP:
      validSubnets: ["10.0.10.0/24"]

cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets: ["10.0.10.0/24"]
  controllerManager:
    extraArgs:
      bind-address: "0.0.0.0"
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"
