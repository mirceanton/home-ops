---
#! Uses talhelper variables: ${registry_username}, ${registry_password}
machine:
  registries:
    config:
      registry.nas.svc.h.mirceanton.com:
        auth:
          username: ${registry_username}
          password: ${registry_password}
    mirrors:
      docker.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/docker.io/"]
        overridePath: true
      registry-1.docker.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/registry-1.docker.io/"]
        overridePath: true
      ghcr.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/ghcr.io/"]
        overridePath: true
      gcr.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/gcr.io/"]
        overridePath: true
      quay.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/quay.io/"]
        overridePath: true
      registry.k8s.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/registry.k8s.io/"]
        overridePath: true
      oci.external-secrets.io:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/oci.external-secrets.io/"]
        overridePath: true
      # Talos >= 1.14 only publishes the installer on the Image Factory (there is
      # no v1.14.x tag on ghcr.io/siderolabs/installer), and the Services VLAN has
      # no internet egress, so the factory host needs a mirror too. This requires
      # a `docker-factory` proxy repo on the NAS Nexus (remoteUrl
      # https://factory.talos.dev) - see ../README.md, "Open items".
      factory.talos.dev:
        skipFallback: true
        endpoints: ["https://registry.nas.svc.h.mirceanton.com/v2/factory.talos.dev/"]
        overridePath: true
