---
# Host DNS configuration:
# - forwardKubeDNSToHost: Disabled to keep cluster DNS separate from host DNS,
#   preventing potential DNS loops and maintaining isolation
# - resolveMemberNames: Enable resolution of cluster member hostnames
# Search domain disabled in /etc/resolv.conf to prevent short hostnames from
# getting the cluster's search domain appended on external DNS lookups.
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
searchDomains:
  disableDefault: true
