---
#? Install Talos onto the Samsung 860 EVO 500GB in the internal SATA slot (ex home-ops cache-pool,
#? serial S3Z2NB1K729005X). Matched by WWID: Talos reports no serial and a truncated model
#? ("Samsung SSD 860") for it. The disk is shared: EPHEMERAL is capped below, the rest is ZFS.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.transport == "sata" && disk.wwid == "naa.5002538e405dc1b7"

---
#? Cap EPHEMERAL (container images, logs, emptyDirs) so the rest of the disk is left for ZFS.
#? The old node's imagefs sat at ~100GiB (30d peak ~190GiB, incl. the dropped CUDA/AI images);
#? kubelet image GC kicks in at 85%, so 150GiB leaves headroom for image churn.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 150GiB

---
#? Raw partition (label r-zfs) for the OpenEBS ZFS pool, taking the remaining ~310GiB.
#? Talos doesn't create zpools; after install, create it once from a privileged pod with /dev mounted:
#?   zpool create -o ashift=12 -o autotrim=on -O compression=zstd -O atime=off \
#?     -O xattr=sa -O acltype=posixacl -m none data-pool /dev/disk/by-partlabel/r-zfs
#? The zfs extension re-imports it on boot.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: zfs
provisioning:
  diskSelector:
    match: system_disk
  minSize: 250GiB
  grow: true

---
#? Use the Intel Optane M10 for the etcd data volume.
#? Keeps etcd's fsync-heavy writes off the OS disk. Can only be set at cluster creation time.
apiVersion: v1alpha1
kind: VolumeConfig
name: ETCD
provisioning:
  diskSelector:
    match: disk.transport == "nvme" && disk.model == "INTEL MEMPEK1J016GAD"
  minSize: 2GiB
  grow: true

---
#? Management NIC (enp2s0, I225-V)
apiVersion: v1alpha1
kind: LinkConfig
name: enp2s0
up: true

---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp2s0
routeMetric: 1024

---
#? For the OpenEBS data-pool on the r-zfs partition
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs

---
#? default-node: matches the PodNodeSelector clusterDefaultNodeSelector (see control-plane.yaml),
#? so pods in namespaces without their own node-selector can schedule here.
#? remote-node: selected by the ai and github-actions namespaces.
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  k8s.mirceanton.com/default-node: "true"
  k8s.mirceanton.com/remote-node: "true"
