---
#! Uses ${registry_username} / ${registry_password}, from talenv.sops.yaml (see talstomize.yaml)
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: registry.nas.svc.h.mirceanton.com
username: ${registry_username}
password: ${registry_password}
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
skipFallback: true
endpoints:
  - url: https://registry.nas.svc.h.mirceanton.com/v2/docker.io/
    overridePath: true
---
