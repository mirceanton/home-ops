---
# Host DNS configuration:
# - forwardKubeDNSToHost: Disabled to keep cluster DNS separate from host DNS,
#   preventing potential DNS loops and maintaining isolation
# - resolveMemberNames: Enable resolution of cluster member hostnames
# Search domains: none at all. disableDefault drops the hostname-derived domain;
# the explicit empty list overrides DHCP-provided ones, which Talos applies since
# v1.14 (siderolabs/talos 5b81b20d3). Otherwise pods inherit svc.h.mirceanton.com,
# which upstream answers with NODATA, and musl (Alpine) resolvers give up on it.
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
searchDomains:
  disableDefault: true
  domains: []
