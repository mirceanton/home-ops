---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/keycloak.hostzero.com/keycloakclient_v1beta1.json
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: "${APP}"
spec:
  clusterRealmRef:
    name: homelab

  clientId: ${KEYCLOAK_CLIENT_ID:-"${APP}"} #? defaults to metadata.name

  # Auto-create Secret with client credentials
  clientSecretRef:
    create: true
    name: "${APP}-oidc-secret"
    clientIdKey: client-id
    clientSecretKey: client-secret

  definition:
    description: ${KEYCLOAK_CLIENT_DESCRIPTION:-"Operator Managed"}
    baseUrl: ${KEYCLOAK_CLIENT_HOME_URL:-"https://${APP}.home.mirceanton.com"}
    protocol: ${KEYCLOAK_CLIENT_PROTOCOL:-openid-connect}
    publicClient: ${KEYCLOAK_CLIENT_PUBLIC:-false}
    standardFlowEnabled: ${KEYCLOAK_CLIENT_STANDARD_FLOW:-true}
    directAccessGrantsEnabled: ${KEYCLOAK_CLIENT_DIRECT_ACCESS_GRANTS:-true}
    serviceAccountsEnabled: ${KEYCLOAK_CLIENT_SERVICE_ACCOUNTS:-true}
    redirectUris:
      - ${KEYCLOAK_CLIENT_REDIRECT_URL:-"https://${APP}.home.mirceanton.com/*"}
    webOrigins:
      - ${KEYCLOAK_CLIENT_WEB_ORIGIN:-"https://${APP}.home.mirceanton.com"}

    # NOTE: full replace, not an addition - see the realm's defaultDefaultClientScopes
    # comment for why. Realm-level defaults only apply to clients created after
    # they're set, so this is what actually gets every EXISTING client (not just
    # new ones) the groups claim on the next reconcile.
    defaultClientScopes:
      - profile
      - email
      - roles
      - web-origins
      - acr
      - groups
